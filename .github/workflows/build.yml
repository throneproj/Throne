name: Throne build matrix
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag and version"
        required: true
      publish:
        description: "r for normal release, p for prerelease, leave empty to not publish anything"
        required: false
      tests:
        description: "Run the smoke and end-to-end test jobs"
        type: boolean
        default: false
env:
  # Every job's Go, and the golang image the Dockerfile builds thronectl with. The legacy builds use MetaCubeX's Go 1.26.
  GO_VERSION: "1.27.3"
  PROTOC_VERSION: "36.2"
  # throneproj/cronet-go commit whose Chromium toolchain builds the Linux core.
  CRONET_GO_REF: "2ee86b72426042457b8eb879ab32296f5752bf2f"
  # thronectl's source for the Linux zips and packages, the Docker image and the tests; the commit must be pushed to
  # throneproj/Throne-api.
  # A THRONE_API_REF repository variable overrides it.
  THRONE_API_REF: ${{ vars.THRONE_API_REF || 'b5758e3ca341aab6d4124aedc4d04845ca1ab069' }}
jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Checking the engine/UI boundary
        run: cmake -DROOT=${{ github.workspace }} -P cmake/EngineBoundary.cmake
      - name: Checking the changelog
        if: github.event.inputs.publish == 'r' || github.event.inputs.publish == 'p'
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: bash ./script/release_notes.sh "$TAG" > /dev/null
  build-go:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - cross_os: windows
            cross_arch: amd64
            runner: ubuntu-22.04
          - cross_os: windows
            cross_arch: arm64
            runner: ubuntu-22.04
          - cross_os: linux
            cross_arch: amd64
            runner: ubuntu-22.04
          - cross_os: linux
            cross_arch: arm64
            runner: ubuntu-22.04
          - cross_os: darwin
            cross_arch: amd64
            runner: macos-latest
          - cross_os: darwin
            cross_arch: arm64
            runner: macos-latest
          - cross_os: darwinlegacy
            cross_arch: amd64
            runner: macos-latest
          - cross_os: windowslegacy
            cross_arch: amd64
            runner: macos-latest
          - cross_os: windowslegacy
            cross_arch: 386
            runner: macos-latest
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    env:
      DEST: ${{ github.workspace }}/deployment/${{ matrix.cross_os }}-${{ matrix.cross_arch }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Cache Common Download
        id: cache-common
        uses: actions/cache@v6.1.0
        with:
          path: artifacts.tgz
          key: CommonCache-${{ matrix.cross_os }}-${{ matrix.cross_arch }}-${{ hashFiles('script/build_go.sh', 'core/**') }}-${{ env.GO_VERSION }}-${{ env.CRONET_GO_REF }}
      - name: Install Golang
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
      - name: Install Golang For Legacy OS
        if: steps.cache-common.outputs.cache-hit != 'true' && contains( matrix.cross_os, 'legacy' )
        run: |
          # MetaCubeX/go restores Win7 / macOS 10.15 support; stay on 1.26 since Go 1.27 drops macOS < 13
          mkdir -p golang.org
          curl -fL "https://github.com/MetaCubeX/go/releases/download/build/go1.26.$(go env GOHOSTOS)-$(go env GOHOSTARCH).tar.gz" | tar -xz -C golang.org
      - name: Install Protoc
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) platform=linux-x86_64 ;;
            Linux-ARM64) platform=linux-aarch_64 ;;
            macOS-*) platform=osx-universal_binary ;;
          esac
          curl -fLso "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-$platform.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: Installing protoc-gen-go
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Clone cronet-go
        if: matrix.cross_os == 'linux' && steps.cache-common.outputs.cache-hit != 'true'
        run: |
          set -xeuo pipefail
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/throneproj/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "$CRONET_GO_REF"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1
      - name: Download Chromium toolchain
        if: matrix.cross_os == 'linux' && steps.cache-common.outputs.cache-hit != 'true'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.cross_arch }} download-toolchain
      - name: Set Chromium toolchain environment
        if: matrix.cross_os == 'linux' && steps.cache-common.outputs.cache-hit != 'true'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.cross_arch }} env >> $GITHUB_ENV
      - name: Build golang parts
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        run: |
          GOOS=${{ matrix.cross_os }} GOARCH=${{ matrix.cross_arch }} ./script/build_go.sh
      - name: Tar files
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: tar czf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Throne-${{ github.sha }}-Common-${{ matrix.cross_os }}-${{ matrix.cross_arch }}
          path: artifacts.tgz
          compression-level: 0
  build-android:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    env:
      DEST: ${{ github.workspace }}/deployment/android
      NDK_VERSION: "28.2.13676358"
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Install Golang
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
      - name: Install JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK
        run: |
          set -xeuo pipefail
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
      - name: Build Android AAR
        shell: bash
        run: ./script/build_android.sh
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ThroneCore-android-${{ github.sha }}
          path: deployment/android/ThroneCore.aar
          if-no-files-found: error
          compression-level: 0
  build-cpp:
    permissions:
      contents: read
    needs:
      - lint
      - build-go
    strategy:
      matrix:
        include:
          - platform: windows-latest
            qt_version: "6.12.0"
            target: x64
            dest_suffix: windows-amd64
            common: windows-amd64
            launcher: sccache
          - platform: windows-11-arm
            qt_version: "6.12.0"
            target: arm64
            dest_suffix: windows-arm64
            common: windows-arm64
            launcher: ""
          # The bundled-Qt linux-amd64 and linux-arm64 builds are build-cpp-manylinux's.
          - platform: ubuntu-22.04
            qt_version: "6.2.0"
            target: x86_64
            dest_suffix: linux-amd64-system-qt
            common: linux-amd64
            launcher: ccache
          - platform: ubuntu-22.04-arm
            qt_version: "6.2.0"
            target: aarch64
            dest_suffix: linux-arm64-system-qt
            common: linux-arm64
            launcher: ccache
          - platform: macos-latest
            qt_version: "6.12.0"
            osx_target: "14.4"
            target: x86_64
            dest_suffix: darwin-amd64
            common: darwin-amd64
            launcher: ccache
          - platform: macos-latest
            qt_version: "6.12.0"
            osx_target: "14.4"
            target: arm64
            dest_suffix: darwin-arm64
            common: darwin-arm64
            launcher: ccache
          - platform: macos-15
            qt_version: "6.4.3"
            osx_target: "10.15"
            target: x86_64
            dest_suffix: darwinlegacy-amd64
            common: darwinlegacy-amd64
            launcher: ccache
          - platform: windows-latest
            qt_version: "6.2.13"
            target: x64
            dest_suffix: windowslegacy-amd64
            common: windowslegacy-amd64
            launcher: sccache
          - platform: windows-2022
            qt_version: "6.2.13"
            target: x86
            dest_suffix: windowslegacy-386
            common: windowslegacy-386
            launcher: sccache
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    env:
      INPUT_VERSION: ${{ github.event.inputs.tag }}
      DEST: ${{ github.workspace }}/deployment/${{ matrix.dest_suffix }}
      DEST_SUFFIX: ${{ matrix.dest_suffix }}
      ARCH: ${{ matrix.target }}
      LAUNCHER_ARGS: ${{ matrix.launcher != '' && format('-DCMAKE_C_COMPILER_LAUNCHER={0} -DCMAKE_CXX_COMPILER_LAUNCHER={0}', matrix.launcher) || '' }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - &checkout-dashboard
        name: Checking out the web dashboard
        uses: actions/checkout@v7.0.1
        with:
          repository: SagerNet/sing-box-dashboard
          ref: gh-pages
          path: dashboard-src
      - &bundle-dashboard
        name: Bundling the web dashboard
        shell: bash
        run: |
          # Read-only pack files make this flaky on Windows; cmake filters .git out anyway.
          rm -rf dashboard-src/.git || true
          cp -R dashboard-src/. res/dashboard/
          # cmake globs res/dashboard at configure time and silently ships nothing if it
          # is empty, so fail here instead of releasing a build without the dashboard.
          test -f res/dashboard/index.html
      # What ilammy/msvc-dev-cmd did: export the environment vcvarsall.bat sets up to the later steps.
      - name: Install MSVC compiler
        if: contains( matrix.platform, 'windows' )
        shell: pwsh
        env:
          MSVC_ARCH: ${{ matrix.target }}
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -prerelease -property installationPath
          if (-not $vs) { throw 'Visual Studio not found' }
          # A wrapper script keeps the quoted path away from PowerShell's cmd.exe argument quoting.
          $bat = Join-Path $env:RUNNER_TEMP 'vcvars.cmd'
          Set-Content -LiteralPath $bat -Encoding ascii -Value "@call `"$vs\VC\Auxiliary\Build\vcvarsall.bat`" $env:MSVC_ARCH >nul && set"
          $vars = & $bat
          # vcvarsall exits 0 even when it rejects the architecture.
          if (-not ($vars -ceq "VSCMD_ARG_TGT_ARCH=$env:MSVC_ARCH")) { throw "vcvarsall.bat $env:MSVC_ARCH did not set up the $env:MSVC_ARCH tools" }
          $changed = foreach ($line in $vars) {
            $name, $value = $line -split '=', 2
            if ($null -ne $value -and $value -cne [Environment]::GetEnvironmentVariable($name)) { "$name=$value" }
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value $changed
      - name: Setup compiler cache
        if: matrix.launcher != ''
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.dest_suffix }}-${{ matrix.qt_version }}
          variant: ${{ matrix.launcher }}
          max-size: 500M
      - &download-common
        name: Download Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: Throne-${{ github.sha }}-Common-${{ matrix.common }}
          path: download-artifact
      # ========================================================================================================= Qt Install
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.5.0
        if: contains( matrix.platform, 'macos' )
        with:
          version: ${{ matrix.qt_version }}
          setup-python: true
          cache: true
          cache-key-prefix: QtCache-${{ matrix.dest_suffix }}
      # ========================================================================================================= Generate MakeFile and Build
      - name: Windows - Cache Qt and OpenSSL
        id: cache-winqt
        if: contains( matrix.platform, 'windows' )
        uses: actions/cache@v6.1.0
        with:
          path: |
            qt.7z
            openssl.7z
          key: WinQt-${{ matrix.qt_version }}-${{ matrix.target }}
      - name: Windows - Download Qt and OpenSSL
        shell: bash
        if: contains( matrix.platform, 'windows' ) && steps.cache-winqt.outputs.cache-hit != 'true'
        run: |
          curl -L -o qt.7z https://github.com/throneproj/buildqt/releases/download/Qt_${{ matrix.qt_version }}/Qt_${{ matrix.qt_version }}_${{ matrix.target }}.7z
          curl -L -o openssl.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/openssl_${{ matrix.target }}.7z
      - name: Windows - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'windows' )
        run: |
          7z x qt.7z
          7z x openssl.7z
          export CMAKE_PREFIX_PATH=$PWD/Qt/lib/cmake
          export OPENSSL_ROOT_DIR=$PWD/openssl
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_windows.sh
      - name: Linux Using System Qt - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'ubuntu' ) && matrix.qt_version == '6.2.0'
        run: |
          sudo apt update
          sudo apt install -y qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6svg6-dev qt6-translations-l10n libglx-dev libgl1-mesa-dev
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc" $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_linux64_system_qt.sh
      - name: macOS - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'macos' )
        run: |
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNKR_PACKAGE_MACOS=1 -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.osx_target }} -DCMAKE_OSX_ARCHITECTURES=${{ matrix.target }} $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_macos.sh
      # ========================================================================================================= Deployments
      - &tar-deployment
        name: Tar files
        shell: bash
        run: tar czf artifacts.tgz ./deployment
      - &upload-deployment
        name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Throne-${{ github.sha }}-${{ matrix.dest_suffix }}
          path: artifacts.tgz
          compression-level: 0
  # The bundled-Qt Linux builds, in the manylinux_2_28 image (AlmaLinux 8, glibc 2.28) that throneproj/buildqt builds
  # their Qt in. gcc-toolset's libstdc++_nonshared links the C++ symbols newer than GCC 8 statically, so the zip and its
  # packages need no more than Debian 10, Ubuntu 20.04 and RHEL 8 ship.
  build-cpp-manylinux:
    permissions:
      contents: read
    needs:
      - lint
      - build-go
    strategy:
      matrix:
        include:
          - platform: ubuntu-24.04
            qt_version: "6.12.0"
            target: x86_64
            dest_suffix: linux-amd64
            common: linux-amd64
          - platform: ubuntu-24.04-arm
            qt_version: "6.12.0"
            target: aarch64
            dest_suffix: linux-arm64
            common: linux-arm64
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.target }}:2026.11.01-2
    defaults:
      run:
        shell: bash
    env:
      INPUT_VERSION: ${{ github.event.inputs.tag }}
      DEST_SUFFIX: ${{ matrix.dest_suffix }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - *checkout-dashboard
      - *bundle-dashboard
      # Throne's CMakeLists needs X11 and xcb, Qt6Gui's config OpenGL, and the link resolves libQt6Gui's libxkbcommon;
      # cmake, patchelf and binutils come with the image. EL8's ninja-build 1.8 can't read CMake 4's multi-output rules.
      - name: Installing the build dependencies
        run: |
          dnf install -y libX11-devel libxcb-devel mesa-libGL-devel libxkbcommon
          pipx install ninja==1.13.2
      # EPEL's ccache 3.7 ignores the cache_dir the action sets, so take the action's pinned static ccache instead.
      - name: Setup compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.dest_suffix }}-${{ matrix.qt_version }}-manylinux_2_28
          install: binary
          max-size: 500M
      - *download-common
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v6.1.0
        with:
          path: qt.tar.xz
          key: LinuxQt-${{ matrix.qt_version }}-${{ matrix.target }}
      - name: Download Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: curl -fLo qt.tar.xz https://github.com/throneproj/buildqt/releases/download/Qt_${{ matrix.qt_version }}/Qt_${{ matrix.qt_version }}_linux_${{ matrix.target }}.tar.xz
      # No -static-libgcc: the toolset links the system's GCC 8 libgcc_s, which the bundled Qt loads anyway.
      - name: Generate MakeFile and Build
        run: |
          tar xJf qt.tar.xz
          export CMAKE_PREFIX_PATH=$PWD/Qt/lib/cmake
          # github.workspace is the runner's path, not this container's.
          export DEST=$GITHUB_WORKSPACE/deployment/$DEST_SUFFIX
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ..
          cmake --build .
          cd ..
          ./script/deploy_linux64.sh
      - *tar-deployment
      - *upload-deployment
  # Runs the linux-amd64 build headless: as the runner user, then as a root systemd notify unit with a watchdog.
  headless-smoke:
    name: Headless smoke test
    runs-on: ubuntu-22.04
    needs:
      - build-cpp
      - build-cpp-manylinux
    if: inputs.tests
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      THRONE_DIR: ${{ github.workspace }}/deployment/linux-amd64
      THRONECTL: ${{ github.workspace }}/throne-api/thronectl
    steps:
      # actions/checkout only says "not our ref" when the pinned commit was never pushed.
      - name: Checking the Throne-api ref is pushed
        run: |
          git init -q "$RUNNER_TEMP/throne-api-ref"
          git -C "$RUNNER_TEMP/throne-api-ref" fetch -q --depth=1 https://github.com/throneproj/Throne-api "$THRONE_API_REF" || { echo "::error::Throne-api $THRONE_API_REF is not on GitHub; push it first"; exit 1; }
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Checking out Throne-api
        uses: actions/checkout@v7.0.1
        with:
          repository: throneproj/Throne-api
          ref: ${{ env.THRONE_API_REF }}
          path: throne-api
          persist-credentials: false
      - name: Install Golang
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            throne-api/go.sum
      - name: Building thronectl
        working-directory: throne-api
        run: CGO_ENABLED=0 go build -trimpath -o "$THRONECTL" ./cmd/thronectl
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: Throne-${{ github.sha }}-linux-amd64
          path: download-artifact
      - name: Unpacking the build
        run: tar xzf download-artifact/artifacts.tgz
      # Qt6Gui links these at load time even headless, and the runner image lacks some.
      - name: Installing the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libglx0 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Smoke test as the runner user
        run: bash ./script/ci/headless_smoke.sh a
      - name: Smoke test as a systemd notify service
        run: bash ./script/ci/headless_smoke.sh b
  pack:
    name: Pack ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs:
      - build-cpp
      - build-cpp-manylinux
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: windows
            runner: windows-latest
            artifacts: "windows*"
          # symbol_limits: <deployment dir>=<GLIBC>[,<GLIBCXX>,<CXXABI>], the newest versions its ELF files may need: the
          # glibc of the image it was built in and, for the bundled builds, GCC 8's libstdc++ (Debian 10, RHEL 8).
          - target: linux-amd64
            runner: ubuntu-latest
            artifacts: "linux-amd64*"
            tools: rpm
            symbol_limits: "linux-amd64=2.28,3.4.25,1.3.11 linux-amd64-system-qt=2.35"
          - target: linux-arm64
            runner: ubuntu-latest
            artifacts: "linux-arm64*"
            tools: rpm
            symbol_limits: "linux-arm64=2.28,3.4.25,1.3.11 linux-arm64-system-qt=2.35"
          - target: macos
            runner: ubuntu-latest
            artifacts: "darwin*"
          - target: debug
            runner: ubuntu-latest
            artifacts: "*"
      fail-fast: false
    env:
      THRONECTL: ${{ github.workspace }}/throne-api/thronectl
    steps:
      - name: Checking the Throne-api ref is pushed
        if: startsWith(matrix.target, 'linux-')
        run: |
          git init -q "$RUNNER_TEMP/throne-api-ref"
          git -C "$RUNNER_TEMP/throne-api-ref" fetch -q --depth=1 https://github.com/throneproj/Throne-api "$THRONE_API_REF" || { echo "::error::Throne-api $THRONE_API_REF is not on GitHub; push it first"; exit 1; }
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: Throne-${{ github.sha }}-${{ matrix.artifacts }}
          path: download-artifact
      - name: Install packaging tools
        if: matrix.tools
        run: sudo apt install ${{ matrix.tools }}
      # thronectl ships in the Linux zip and packages. No -X main.version: release builds set it to a tag, while
      # THRONE_API_REF is a commit, so Go's VCS stamping names it (the tag when the commit has one), as in the image.
      - name: Checking out Throne-api
        if: startsWith(matrix.target, 'linux-')
        uses: actions/checkout@v7.0.1
        with:
          repository: throneproj/Throne-api
          ref: ${{ env.THRONE_API_REF }}
          path: throne-api
          persist-credentials: false
      - name: Install Golang
        if: startsWith(matrix.target, 'linux-')
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            throne-api/go.sum
      - name: Building thronectl
        if: startsWith(matrix.target, 'linux-')
        working-directory: throne-api
        env:
          TARGET: ${{ matrix.target }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH="${TARGET#linux-}" go build -trimpath -ldflags "-s -w" -o "$THRONECTL" ./cmd/thronectl
      - name: Pack
        shell: bash
        run: bash ./script/pack_release.sh ${{ matrix.target }} "${{ github.event.inputs.tag }}"
      # Pins each build's floor over every ELF file it ships, Qt and its plugins included: a build image or dependency
      # bump that raises it fails here, not in an older system's loader.
      - name: Checking glibc and libstdc++ symbol versions
        if: matrix.symbol_limits
        shell: bash
        env:
          SYMBOL_LIMITS: ${{ matrix.symbol_limits }}
        run: |
          rc=0
          kinds=(GLIBC GLIBCXX CXXABI)
          row() { printf '%-22s %-56s %-8s %-8s %-8s %s\n' "$@"; }
          row dir file "${kinds[@]}" limit
          for entry in $SYMBOL_LIMITS; do
            dir=${entry%%=*}
            limit=${entry#*=}
            IFS=, read -r -a max <<<"$limit"
            for bin in Throne ThroneCore; do
              [ -f "deployment/$dir/$bin" ] || { echo "::error::deployment/$dir/$bin is missing"; rc=1; }
            done
            while IFS= read -r -d '' file; do
              [ "$(od -An -tx1 -N4 "$file" | tr -d ' \n')" = 7f454c46 ] || continue
              name=${file#deployment/$dir/}
              # readelf, unlike this runner's objdump, reads arm64 binaries too.
              versions=$(readelf -V -W "$file")
              need=()
              for i in 0 1 2; do
                need[i]=$({ grep -o "${kinds[i]}_[0-9][0-9.]*" <<<"$versions" || true; } | sed "s/^${kinds[i]}_//" | sort -Vu | tail -n1)
              done
              row "$dir" "$name" "${need[0]:--}" "${need[1]:--}" "${need[2]:--}" "$limit"
              for i in 0 1 2; do
                if [ -n "${need[i]}" ] && [ -n "${max[i]:-}" ] &&
                  [ "$(printf '%s\n' "${need[i]}" "${max[i]}" | sort -V | tail -n1)" != "${max[i]}" ]; then
                  echo "::error::$dir/$name needs ${kinds[i]}_${need[i]}, newer than the ${kinds[i]}_${max[i]} this build may need"
                  rc=1
                fi
              done
            done < <(find "deployment/$dir" -type f ! -name '*.debug' -print0 | sort -z)
          done
          exit $rc
      - name: Uploading Artifact
        if: matrix.target != 'debug'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Pack-${{ github.sha }}-${{ matrix.target }}
          path: deployment/Throne-*
          if-no-files-found: error
          compression-level: 0
      - name: Uploading Debug Artifact
        if: matrix.target == 'debug'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Debug-${{ github.sha }}
          path: deployment/debug-symbols.zip
          if-no-files-found: error
          compression-level: 0
  # Installs a package into a bare container of a system it targets and loads its binaries there, so a dependency the
  # package does not declare, or a glibc or libstdc++ the system is too old for, fails here instead of in a user's
  # dynamic loader.
  package-smoke:
    name: Package smoke ${{ matrix.package }} in ${{ matrix.image }}
    runs-on: ${{ matrix.runner }}
    needs:
      - pack
    if: inputs.tests
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - package: debian-amd64.deb
            pack: linux-amd64
            image: debian:12
            runner: ubuntu-latest
          # Ubuntu 20.04 (glibc 2.31), the oldest Ubuntu the bundled build targets.
          - package: debian-amd64.deb
            pack: linux-amd64
            image: ubuntu:20.04
            runner: ubuntu-latest
          # RHEL 8: exactly the bundled build's glibc 2.28 and GCC 8 libstdc++.
          - package: fedora-amd64.rpm
            pack: linux-amd64
            image: almalinux:8
            runner: ubuntu-latest
          # Raspberry Pi OS bookworm (glibc 2.36) with its own Qt 6 takes the system-qt build.
          - package: debian-arm64-system-qt.deb
            pack: linux-arm64
            image: debian:bookworm-slim
            runner: ubuntu-24.04-arm
          # Raspberry Pi OS bullseye (glibc 2.31) has no Qt 6, so it takes the bundled build. Ubuntu 20.04 stands in for
          # it: same glibc and zstd-less dpkg, and Debian 11's security pool has moved to archive.debian.org.
          - package: debian-arm64.deb
            pack: linux-arm64
            image: ubuntu:20.04
            runner: ubuntu-24.04-arm
      fail-fast: false
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: Pack-${{ github.sha }}-${{ matrix.pack }}
          path: download-artifact
      - name: Installing and running the package
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag }}
          PKG: Throne-${{ github.event.inputs.tag }}-${{ matrix.package }}
          IMAGE: ${{ matrix.image }}
        run: |
          if [ ! -f "download-artifact/$PKG" ]; then
            echo "::error::$PKG is not in Pack-${{ github.sha }}-${{ matrix.pack }}"
            exit 1
          fi
          docker run --rm -e TAG -e PKG -e IMAGE -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD/download-artifact:/pkg:ro" "$IMAGE" bash -c '
            set -euo pipefail
            cd /pkg
            if command -v apt-get >/dev/null; then
              apt-get update -qq
              apt-get install -y --no-install-recommends "./$PKG"
            else
              dnf install -y --setopt=install_weak_deps=False "./$PKG"
            fi
            # The bundled builds also run the updater and, for every download, a TLS plugin carrying its own OpenSSL.
            bins=(/opt/Throne/Throne /opt/Throne/ThroneCore)
            for bin in /opt/Throne/updater /opt/Throne/usr/plugins/tls/*.so; do
              if [ -f "$bin" ]; then bins+=("$bin"); fi
            done
            rc=0
            for bin in "${bins[@]}"; do
              echo "::group::ldd $bin"
              out=$(ldd "$bin" 2>&1) || true
              echo "$out"
              echo "::endgroup::"
              if grep -F "not found" <<<"$out"; then
                echo "::error::$bin does not load in $IMAGE: the package misses a dependency, or needs a newer one"
                rc=1
              fi
            done
            [ "$rc" = 0 ] || exit 1
            version=$(/opt/Throne/Throne --headless --version)
            echo "$version"
            if [ "$version" != "Throne $TAG" ]; then
              echo "::error::Throne --headless --version printed \"$version\", not \"Throne $TAG\""
              exit 1
            fi
            version=$(thronectl version) || { echo "::error::thronectl version failed in $IMAGE"; exit 1; }
            echo "$version"
            for file in /usr/lib/systemd/system/throne-web.service /etc/throne/web.env; do
              [ -f "$file" ] || { echo "::error::the package installs no $file"; exit 1; }
            done
          '
  # Builds the headless image for linux/amd64 and linux/arm64 from the packed linux zips and runs both; pushes it to
  # ghcr.io only when publishing: the tag for p and r, plus latest for r. Skipped when neither testing nor publishing.
  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    needs:
      - pack
    if: inputs.tests || github.event.inputs.publish == 'p' || github.event.inputs.publish == 'r'
    permissions:
      contents: read
      packages: write
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag }}
      PUBLISH: ${{ github.event.inputs.publish }}
      CONTEXT: ${{ github.workspace }}/docker-context
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: Pack-${{ github.sha }}-linux-*
          merge-multiple: true
          path: download-artifact
      # The context mirrors deployment/: linux-<arch>/ holds what the release zip's Throne/ holds.
      - name: Preparing the build context
        id: context
        shell: bash
        run: |
          rm -rf "$CONTEXT"
          mkdir -p "$CONTEXT"
          for arch in amd64 arm64; do
            zip="download-artifact/Throne-$TAG-linux-$arch.zip"
            if [ ! -f "$zip" ]; then
              echo "::error::$zip is missing"
              exit 1
            fi
            unzip -q "$zip" -d "$RUNNER_TEMP/zip-$arch"
            mv "$RUNNER_TEMP/zip-$arch/Throne" "$CONTEXT/linux-$arch"
            # The amd64 runner would run a misplaced amd64 binary natively in the arm64 image, so --version cannot tell.
            machine=$([ "$arch" = amd64 ] && echo x86-64 || echo aarch64)
            for bin in Throne ThroneCore thronectl; do
              case "$(file -b "$CONTEXT/linux-$arch/$bin")" in
              *"$machine"*) ;;
              *)
                echo "::error::linux-$arch/$bin is not an $machine binary"
                exit 1
                ;;
              esac
            done
          done
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/throne"
          push=false
          tags=
          if [ "$PUBLISH" = p ] || [ "$PUBLISH" = r ]; then
            if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::'$TAG' cannot be a Docker image tag"
              exit 1
            fi
            push=true
            tags="$image:$TAG"
            if [ "$PUBLISH" = r ]; then
              tags="$tags,$image:latest"
            fi
          fi
          echo "push=$push" >>"$GITHUB_OUTPUT"
          echo "tags=$tags" >>"$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      # One platform per build so each can be loaded and run; the multi-platform push below reuses their cache.
      - name: Building the amd64 image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          file: docker/Dockerfile
          build-args: |
            THRONE_API_REF=${{ env.THRONE_API_REF }}
            GO_VERSION=${{ env.GO_VERSION }}
          platforms: linux/amd64
          load: true
          tags: throne-ci:amd64
      - name: Building the arm64 image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          file: docker/Dockerfile
          build-args: |
            THRONE_API_REF=${{ env.THRONE_API_REF }}
            GO_VERSION=${{ env.GO_VERSION }}
          platforms: linux/arm64
          load: true
          tags: throne-ci:arm64
      # The entrypoint already passes --headless.
      - name: Running both images
        shell: bash
        run: |
          for arch in amd64 arm64; do
            version=$(docker run --rm --platform "linux/$arch" "throne-ci:$arch" --version)
            echo "linux/$arch: $version"
            if [ "$version" != "Throne $TAG" ]; then
              echo "::error::linux/$arch: --version printed \"$version\", not \"Throne $TAG\""
              exit 1
            fi
            docker run --rm --platform "linux/$arch" --entrypoint thronectl "throne-ci:$arch" version
          done
      # amd64 only: under QEMU the arm64 start is too slow for a stable deadline.
      - name: Starting the amd64 image, connecting thronectl and the web UI, stopping it
        shell: bash
        run: |
          docker run -d --name throne-ci --platform linux/amd64 -e 'THRONE_WEB_LISTEN=*:9096' throne-ci:amd64
          trap 'echo "::group::Container log"; docker logs throne-ci 2>&1; echo "::endgroup::"' EXIT
          deadline=$((SECONDS + 90))
          until docker exec throne-ci /opt/Throne/Throne --health >/dev/null 2>&1; do
            if [ "$(docker inspect -f '{{.State.Running}}' throne-ci)" != true ] || ((SECONDS >= deadline)); then
              docker exec throne-ci /opt/Throne/Throne --health || true
              echo "::error::the container did not report healthy within 90 s"
              exit 1
            fi
            sleep 1
          done
          docker exec throne-ci /opt/Throne/Throne --health
          docker exec throne-ci sh -c 'eval "$(/opt/Throne/Throne --print-connection)" && thronectl status'
          # THRONE_WEB_LISTEN makes the entrypoint run the web UI beside Throne; the image has no curl, so the runner
          # reaches it on the container's address (HTTPS, self-signed).
          web="https://$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' throne-ci):9096"
          deadline=$((SECONDS + 30))
          until curl -fsk -o /dev/null "$web/auth/state"; do
            if ((SECONDS >= deadline)); then
              echo "::error::thronectl web did not answer on $web within 30 s"
              exit 1
            fi
            sleep 1
          done
          password=$(docker logs throne-ci 2>&1 | sed -n 's/^thronectl web: created the web UI password: //p' | tail -n1)
          [ -n "$password" ] || { echo "::error::the container log has no created web UI password"; exit 1; }
          jar="$RUNNER_TEMP/web-cookies"
          # The session cookie counts only together with its CSRF token from the login.
          csrf=$(jq -nc --arg password "$password" '{password: $password}' |
            curl -fsSk -c "$jar" -H 'Content-Type: application/json' --data @- "$web/auth/login" |
            jq -er 'select(.authenticated == true) | .csrf') || { echo "::error::POST /auth/login did not sign in"; exit 1; }
          curl -fsSk -b "$jar" -H "X-CSRF-Token: $csrf" "$web/api/v1/status" |
            jq -e '.capabilities.headless == true' >/dev/null || { echo "::error::GET /api/v1/status through the web UI failed"; exit 1; }
          docker stop --time 45 throne-ci
          code=$(docker inspect -f '{{.State.ExitCode}}' throne-ci)
          if [ "$code" != 0 ]; then
            echo "::error::the container exited with $code after docker stop, not 0"
            exit 1
          fi
          if docker logs throne-ci 2>&1 | grep -nE 'HEADLESS-(DIALOG|WIDGET)|POLICY-UNBOUND'; then
            echo "::error::headless Throne reached a GUI-only path"
            exit 1
          fi
      - name: Logging in to ghcr.io
        if: steps.context.outputs.push == 'true'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pushing the image
        if: steps.context.outputs.push == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          file: docker/Dockerfile
          build-args: |
            THRONE_API_REF=${{ env.THRONE_API_REF }}
            GO_VERSION=${{ env.GO_VERSION }}
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.context.outputs.tags }}
          push: true
  # ===================================================================================================== Headless end to end
  # script/ci/e2e runs headless Throne the way users do, so no scratch VMs are needed. These jobs run only with the tests
  # input and only report: publish does not wait for them. Tun and the kill switch run only in containers with their own network namespace, never on a
  # runner host, which they would cut off. A failed job uploads its logs as the artifact <job id>-logs.
  # A needs on a matrix job waits for every leg and skips the job when any leg failed; Actions cannot depend on one leg.
  # So each job runs unless the run was cancelled or its matrix never ran, and downloads the one artifact it tests right
  # after the checkout: when that leg failed, the job ends there with "Artifact not found". The jobs that test packages
  # still need every build-cpp and build-cpp-manylinux leg, because pack does.
  e2e-linux-packages:
    name: E2E deb under systemd
    runs-on: ubuntu-24.04
    needs:
      - pack
    if: ${{ inputs.tests && !cancelled() && needs.pack.result != 'skipped' }}
    permissions:
      contents: read
    timeout-minutes: 40
    env:
      THRONECTL: ${{ github.workspace }}/throne-api/thronectl
      FIXTURES: ${{ github.workspace }}/script/ci/smoke_fixtures.py
      E2E_TMP: ${{ github.workspace }}/e2e-tmp
      DEB: ${{ github.workspace }}/download-artifact/Throne-${{ github.event.inputs.tag }}-debian-amd64.deb
    steps:
      - name: Checking the Throne-api ref is pushed
        run: |
          git init -q "$RUNNER_TEMP/throne-api-ref"
          git -C "$RUNNER_TEMP/throne-api-ref" fetch -q --depth=1 https://github.com/throneproj/Throne-api "$THRONE_API_REF" || { echo "::error::Throne-api $THRONE_API_REF is not on GitHub; push it first"; exit 1; }
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: Pack-${{ github.sha }}-linux-amd64
          path: download-artifact
      - name: Checking out Throne-api
        uses: actions/checkout@v7.0.1
        with:
          repository: throneproj/Throne-api
          ref: ${{ env.THRONE_API_REF }}
          path: throne-api
          persist-credentials: false
      - name: Install Golang
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            throne-api/go.sum
      - name: Building thronectl
        working-directory: throne-api
        run: CGO_ENABLED=0 go build -trimpath -o "$THRONECTL" ./cmd/thronectl
      - name: Installing the deb and running it under systemd
        timeout-minutes: 30
        run: bash ./script/ci/e2e/linux_packages.sh
      - name: Collecting the logs
        if: failure()
        run: |
          mkdir -p e2e-logs
          sudo journalctl -u throne --no-pager -o short-monotonic >e2e-logs/journal-throne.txt 2>&1 || true
          sudo sh -c 'tail -n +1 /var/lib/throne/config/logs/*.log' >e2e-logs/var-lib-throne-logs.txt 2>&1 || true
          # Root-owned files and live sockets would fail the upload: copy the regular files, without keys and binaries.
          if [ -d "$E2E_TMP" ]; then
            (cd "$E2E_TMP" && sudo find . -type f -size -16M ! -name '*.key' -print0 | sudo tar -cf - --null -T -) | tar -xf - -C e2e-logs || true
          fi
      - name: Uploading the logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-linux-packages-logs
          path: e2e-logs
          if-no-files-found: ignore
          overwrite: true
  e2e-linux-scenarios:
    name: E2E Linux scenarios in containers
    runs-on: ubuntu-24.04
    needs:
      - build-cpp-manylinux
    if: ${{ inputs.tests && !cancelled() && needs.build-cpp-manylinux.result != 'skipped' }}
    permissions:
      contents: read
    timeout-minutes: 75
    env:
      THRONE_DIR: ${{ github.workspace }}/deployment/linux-amd64
      THRONECTL: ${{ github.workspace }}/throne-api/thronectl
      FIXTURES: ${{ github.workspace }}/script/ci/smoke_fixtures.py
      E2E_TMP: ${{ github.workspace }}/e2e-tmp
      E2E_IMAGE: throne-e2e:amd64
    steps:
      - name: Checking the Throne-api ref is pushed
        run: |
          git init -q "$RUNNER_TEMP/throne-api-ref"
          git -C "$RUNNER_TEMP/throne-api-ref" fetch -q --depth=1 https://github.com/throneproj/Throne-api "$THRONE_API_REF" || { echo "::error::Throne-api $THRONE_API_REF is not on GitHub; push it first"; exit 1; }
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: Throne-${{ github.sha }}-linux-amd64
          path: download-artifact
      - name: Checking out Throne-api
        uses: actions/checkout@v7.0.1
        with:
          repository: throneproj/Throne-api
          ref: ${{ env.THRONE_API_REF }}
          path: throne-api
          persist-credentials: false
      - name: Install Golang
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            throne-api/go.sum
      - name: Building thronectl
        working-directory: throne-api
        run: CGO_ENABLED=0 go build -trimpath -o "$THRONECTL" ./cmd/thronectl
      - name: Unpacking the build
        run: tar xzf download-artifact/artifacts.tgz
      # The release image, built from this deployment as docker-image builds it from the packed zip (the dockerignore
      # next to the Dockerfile leaves Throne.debug out), so the scenarios do not wait for pack. A failed build fails only
      # scenario 11, which then finds no $E2E_IMAGE; the other ten still run, and the job still fails.
      - name: Building the Docker image
        continue-on-error: true
        run: docker build -f docker/Dockerfile --build-arg THRONE_API_REF="$THRONE_API_REF" --build-arg GO_VERSION="$GO_VERSION" -t "$E2E_IMAGE" deployment
      - name: Running the scenarios
        timeout-minutes: 60
        run: bash ./script/ci/e2e/linux_scenarios.sh
      - name: Collecting the logs
        if: failure()
        run: |
          mkdir -p e2e-logs
          docker ps -a >e2e-logs/docker-ps.txt 2>&1 || true
          # Root-owned files and live sockets would fail the upload: copy the regular files, without keys and binaries.
          if [ -d "$E2E_TMP" ]; then
            (cd "$E2E_TMP" && sudo find . -type f -size -16M ! -name '*.key' -print0 | sudo tar -cf - --null -T -) | tar -xf - -C e2e-logs || true
          fi
      - name: Uploading the logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-linux-scenarios-logs
          path: e2e-logs
          if-no-files-found: ignore
          overwrite: true
  e2e-linux-arm64:
    name: E2E arm64 deb on Debian bookworm
    runs-on: ubuntu-24.04-arm
    needs:
      - pack
    if: ${{ inputs.tests && !cancelled() && needs.pack.result != 'skipped' }}
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      THRONECTL: ${{ github.workspace }}/throne-api/thronectl
      FIXTURES: ${{ github.workspace }}/script/ci/smoke_fixtures.py
      E2E_TMP: ${{ github.workspace }}/e2e-tmp
      SYSTEMQT_DEB: ${{ github.workspace }}/download-artifact/Throne-${{ github.event.inputs.tag }}-debian-arm64-system-qt.deb
      BUNDLED_DEB: ${{ github.workspace }}/download-artifact/Throne-${{ github.event.inputs.tag }}-debian-arm64.deb
    steps:
      - name: Checking the Throne-api ref is pushed
        run: |
          git init -q "$RUNNER_TEMP/throne-api-ref"
          git -C "$RUNNER_TEMP/throne-api-ref" fetch -q --depth=1 https://github.com/throneproj/Throne-api "$THRONE_API_REF" || { echo "::error::Throne-api $THRONE_API_REF is not on GitHub; push it first"; exit 1; }
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: Pack-${{ github.sha }}-linux-arm64
          path: download-artifact
      - name: Checking out Throne-api
        uses: actions/checkout@v7.0.1
        with:
          repository: throneproj/Throne-api
          ref: ${{ env.THRONE_API_REF }}
          path: throne-api
          persist-credentials: false
      - name: Install Golang
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            throne-api/go.sum
      - name: Building thronectl
        working-directory: throne-api
        run: CGO_ENABLED=0 go build -trimpath -o "$THRONECTL" ./cmd/thronectl
      - name: Running the arm64 packages in Ubuntu 18.04 and Debian bookworm
        timeout-minutes: 20
        run: bash ./script/ci/e2e/linux_arm64.sh
      - name: Collecting the logs
        if: failure()
        run: |
          mkdir -p e2e-logs
          # Root-owned files and live sockets would fail the upload: copy the regular files, without keys and binaries.
          if [ -d "$E2E_TMP" ]; then
            (cd "$E2E_TMP" && sudo find . -type f -size -16M ! -name '*.key' -print0 | sudo tar -cf - --null -T -) | tar -xf - -C e2e-logs || true
          fi
      - name: Uploading the logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-linux-arm64-logs
          path: e2e-logs
          if-no-files-found: ignore
          overwrite: true
  e2e-macos:
    name: E2E macOS LaunchDaemon
    # build-cpp's darwin-arm64 leg, so the test runs on the macOS generation the app was built on.
    runs-on: macos-latest
    needs:
      - build-cpp
    if: ${{ inputs.tests && !cancelled() && needs.build-cpp.result != 'skipped' }}
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      THRONE_APP: ${{ github.workspace }}/deployment/darwin-arm64/Throne.app
      THRONECTL: ${{ github.workspace }}/throne-api/thronectl
      FIXTURES: ${{ github.workspace }}/script/ci/smoke_fixtures.py
      E2E_TMP: ${{ github.workspace }}/e2e-tmp
    steps:
      - name: Checking the Throne-api ref is pushed
        run: |
          git init -q "$RUNNER_TEMP/throne-api-ref"
          git -C "$RUNNER_TEMP/throne-api-ref" fetch -q --depth=1 https://github.com/throneproj/Throne-api "$THRONE_API_REF" || { echo "::error::Throne-api $THRONE_API_REF is not on GitHub; push it first"; exit 1; }
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: Throne-${{ github.sha }}-darwin-arm64
          path: download-artifact
      - name: Checking out Throne-api
        uses: actions/checkout@v7.0.1
        with:
          repository: throneproj/Throne-api
          ref: ${{ env.THRONE_API_REF }}
          path: throne-api
          persist-credentials: false
      - name: Install Golang
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            throne-api/go.sum
      - name: Building thronectl
        working-directory: throne-api
        run: CGO_ENABLED=0 go build -trimpath -o "$THRONECTL" ./cmd/thronectl
      - name: Unpacking the build
        run: tar xzf download-artifact/artifacts.tgz
      - name: Running Throne as a LaunchDaemon
        timeout-minutes: 20
        run: bash ./script/ci/e2e/macos_launchd.sh
      - name: Collecting the logs
        if: failure()
        run: |
          mkdir -p e2e-logs
          sudo launchctl print system/moe.Throne.headless >e2e-logs/launchctl-print.txt 2>&1 || true
          # Root-owned files and live sockets would fail the upload: copy the regular files, without keys and binaries.
          if [ -d "$E2E_TMP" ]; then
            (cd "$E2E_TMP" && sudo find . -type f -size -16M ! -name '*.key' -print0 | sudo tar -cf - --null -T -) | tar -xf - -C e2e-logs || true
          fi
      - name: Uploading the logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-macos-logs
          path: e2e-logs
          if-no-files-found: ignore
          overwrite: true
  e2e-windows:
    name: E2E Windows service
    runs-on: windows-latest
    needs:
      - build-cpp
    if: ${{ inputs.tests && !cancelled() && needs.build-cpp.result != 'skipped' }}
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      THRONE_DIR: ${{ github.workspace }}\deployment\windows-amd64
      THRONECTL: ${{ github.workspace }}\throne-api\thronectl.exe
      FIXTURES: ${{ github.workspace }}\script\ci\smoke_fixtures.py
      E2E_TMP: ${{ github.workspace }}\e2e-tmp
    steps:
      - name: Checking the Throne-api ref is pushed
        run: |
          git init -q "$RUNNER_TEMP/throne-api-ref"
          git -C "$RUNNER_TEMP/throne-api-ref" fetch -q --depth=1 https://github.com/throneproj/Throne-api "$THRONE_API_REF" || { echo "::error::Throne-api $THRONE_API_REF is not on GitHub; push it first"; exit 1; }
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: Throne-${{ github.sha }}-windows-amd64
          path: download-artifact
      - name: Checking out Throne-api
        uses: actions/checkout@v7.0.1
        with:
          repository: throneproj/Throne-api
          ref: ${{ env.THRONE_API_REF }}
          path: throne-api
          persist-credentials: false
      - name: Install Golang
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            throne-api/go.sum
      - name: Building thronectl
        working-directory: throne-api
        run: CGO_ENABLED=0 go build -trimpath -o "$THRONECTL" ./cmd/thronectl
      - name: Unpacking the build
        run: tar xzf download-artifact/artifacts.tgz
      - name: Running Throne as a Windows service
        timeout-minutes: 20
        shell: pwsh
        run: >-
          pwsh -NoProfile -File ./script/ci/e2e/windows_service.ps1 -ThroneDir $env:THRONE_DIR -Thronectl $env:THRONECTL
          -Fixtures $env:FIXTURES -RepoRoot $env:GITHUB_WORKSPACE -WorkDir $env:E2E_TMP
      - name: Collecting the logs
        if: failure()
        shell: pwsh
        run: |
          $logs = (New-Item -ItemType Directory -Force e2e-logs).FullName
          sc.exe qc Throne 2>&1 | Out-File (Join-Path $logs sc-qc.txt)
          sc.exe query Throne 2>&1 | Out-File (Join-Path $logs sc-query.txt)
          Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager' } -MaxEvents 300 -ErrorAction SilentlyContinue |
            Where-Object Message -match 'Throne' | Format-List TimeCreated, Id, Message | Out-File (Join-Path $logs scm-events.txt)
          $sources = @(@{ Dir = 'C:\ProgramData\Throne\config\logs'; To = 'programdata-logs' }, @{ Dir = $env:E2E_TMP; To = 'e2e-tmp' })
          foreach ($s in $sources) {
            if (-not (Test-Path -LiteralPath $s.Dir)) { continue }
            Get-ChildItem -LiteralPath $s.Dir -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Length -lt 16MB -and $_.Extension -ne '.key' } | ForEach-Object {
                $dest = Join-Path $logs (Join-Path $s.To ([IO.Path]::GetRelativePath($s.Dir, $_.FullName)))
                New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
                Copy-Item -LiteralPath $_.FullName -Destination $dest -ErrorAction SilentlyContinue
              }
          }
          exit 0
      - name: Uploading the logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-windows-logs
          path: e2e-logs
          if-no-files-found: ignore
          overwrite: true
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - pack
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: Pack-${{ github.sha }}-*
          merge-multiple: true
          path: deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Deployment-${{ github.sha }}
          path: deployment
          compression-level: 0
      - name: Installing ghr
        run: |
          curl -fLo - https://github.com/tcnksm/ghr/releases/download/v0.18.5/ghr_v0.18.5_linux_amd64.tar.gz | tar xzv
          mv ghr*linux_amd64/ghr .
      - name: Generating release notes
        if: github.event.inputs.publish == 'r' || github.event.inputs.publish == 'p'
        env:
          TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          {
            bash ./script/release_notes.sh "$TAG"
            echo
            sed "s|{{TAG}}|$TAG|g; s|{{REPO}}|$REPO|g" .github/release_template.md
          } > "$RUNNER_TEMP/release.md"
      - name: PreRelease
        if: github.event.inputs.publish == 'p'
        run: |
          ./ghr -prerelease -delete -c ${{ github.sha }} -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" -b "$(cat "$RUNNER_TEMP/release.md")" "${{ github.event.inputs.tag }}" deployment
      - name: Release
        if: github.event.inputs.publish == 'r'
        run: |
          ./ghr -delete -c ${{ github.sha }} -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" -b "$(cat "$RUNNER_TEMP/release.md")" "${{ github.event.inputs.tag }}" deployment
  # Updates the AUR package after a stable release.
  publish-aur:
    name: Publish AUR Package
    runs-on: ubuntu-latest
    needs:
      - publish
    if: github.event.inputs.publish == 'r'
    permissions:
      contents: read
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Validate version and update PKGBUILD
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z._+]+$ ]]; then
            echo "::error::Cannot publish '$VERSION' to AUR: not a valid pkgver. AUR is only updated for stable releases (publish=r)."
            exit 1
          fi
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/;s/^pkgrel=.*/pkgrel=1/" dist/aur/PKGBUILD
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: throne
          asset_dir: dist/aur
          updpkgsums: true
          commit_username: throneproj-bot
          commit_email: throneproj-bot@users.noreply.github.com
          commit_message: Update to ${{ github.event.inputs.tag }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
  # Updates the cask in throneproj/homebrew-tap after a stable release.
  publish-homebrew:
    name: Publish Homebrew Cask
    runs-on: ubuntu-latest
    needs:
      - publish
    if: github.event.inputs.publish == 'r'
    permissions:
      contents: read
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download macOS artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: Pack-${{ github.sha }}-macos
          path: deployment
      - name: Checking out tap
        uses: actions/checkout@v7.0.1
        with:
          repository: throneproj/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          path: tap
      - name: Update cask
        env:
          VERSION: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z._+]+$ ]]; then
            echo "::error::Cannot publish '$VERSION' to Homebrew: not a valid cask version."
            exit 1
          fi
          ARM64="deployment/Throne-${VERSION}-macos-arm64.zip"
          AMD64="deployment/Throne-${VERSION}-macos-amd64.zip"
          test -f "$ARM64" && test -f "$AMD64"
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/${VERSION}/" \
            -e "s/@SHA256_ARM64@/$(sha256sum "$ARM64" | cut -d' ' -f1)/" \
            -e "s/@SHA256_AMD64@/$(sha256sum "$AMD64" | cut -d' ' -f1)/" \
            dist/homebrew/throne.rb > tap/Casks/throne.rb
      - name: Push cask
        working-directory: tap
        env:
          VERSION: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name throneproj-bot
          git config user.email throneproj-bot@users.noreply.github.com
          git add Casks/throne.rb
          if git diff --cached --quiet; then
            echo "Cask already at $VERSION"
            exit 0
          fi
          git commit -m "throne $VERSION"
          git push
  # Publishes the RPM and APT repositories to this repository's GitHub Pages,
  # served at https://throneproj.github.io/Throne/rpm/ and
  # https://throneproj.github.io/Throne/apt/.
  publish-repos:
    name: Publish RPM and APT Repositories
    runs-on: ubuntu-latest
    needs:
      - publish
    if: github.event.inputs.publish == 'r'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Must match the key in the REPO_SIGNING_KEY secret of the github-pages environment.
      SIGNING_FPR: 5EEB21A857E9C485DBA5F4E000316AB4369049D6
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: Pack-${{ github.sha }}-linux-*
          merge-multiple: true
          path: deployment
      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y createrepo-c dpkg-dev apt-utils rpm
      - name: Import signing key
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$REPO_SIGNING_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$SIGNING_FPR" > /dev/null
          mkdir -p repo
          gpg --batch --armor --export "$SIGNING_FPR" > repo/throne.asc
      - name: Build RPM repository
        env:
          VERSION: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          AMD64="deployment/Throne-${VERSION}-fedora-amd64-system-qt.rpm"
          ARM64="deployment/Throne-${VERSION}-fedora-arm64-system-qt.rpm"
          test -f "$AMD64" && test -f "$ARM64"
          mkdir -p repo/rpm
          cp "$AMD64" "$ARM64" repo/rpm/
          # Signing rewrites the files, so it must run before createrepo_c checksums them.
          rpmsign --addsign --define "_gpg_name $SIGNING_FPR" repo/rpm/*.rpm
          createrepo_c repo/rpm
          gpg --batch --yes --local-user "$SIGNING_FPR" --armor --detach-sign repo/rpm/repodata/repomd.xml
          printf '%s\n' '[throne]' 'name=Throne RPM repository' \
            'baseurl=https://throneproj.github.io/Throne/rpm' \
            'enabled=1' 'autorefresh=1' 'gpgcheck=1' 'repo_gpgcheck=1' \
            'gpgkey=https://throneproj.github.io/Throne/throne.asc' > repo/rpm/throne.repo
      - name: Build APT repository
        env:
          VERSION: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          AMD64="deployment/Throne-${VERSION}-debian-amd64-system-qt.deb"
          ARM64="deployment/Throne-${VERSION}-debian-arm64-system-qt.deb"
          test -f "$AMD64" && test -f "$ARM64"
          mkdir -p repo/apt/pool/main \
            repo/apt/dists/stable/main/binary-amd64 \
            repo/apt/dists/stable/main/binary-arm64
          # dpkg-scanpackages --arch only picks up files named *_<arch>.deb.
          cp "$AMD64" "repo/apt/pool/main/throne_${VERSION}_amd64.deb"
          cp "$ARM64" "repo/apt/pool/main/throne_${VERSION}_arm64.deb"
          cd repo/apt
          for arch in amd64 arm64; do
            dpkg-scanpackages --arch "$arch" pool /dev/null > "dists/stable/main/binary-${arch}/Packages"
            gzip -k9 "dists/stable/main/binary-${arch}/Packages"
          done
          # Staged outside dists/stable, which apt-ftparchive scans, so Release does not list itself.
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=throne \
            -o APT::FTPArchive::Release::Label=Throne \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o 'APT::FTPArchive::Release::Architectures=amd64 arm64' \
            -o APT::FTPArchive::Release::Components=main \
            -o 'APT::FTPArchive::Release::Description=Throne APT repository' \
            release dists/stable > "$RUNNER_TEMP/Release"
          mv "$RUNNER_TEMP/Release" dists/stable/Release
          gpg --batch --yes --local-user "$SIGNING_FPR" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --local-user "$SIGNING_FPR" --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          printf '%s\n' 'deb [signed-by=/etc/apt/keyrings/throne.asc] https://throneproj.github.io/Throne/apt stable main' > throne.list
          # deb822 multi-line field: every line indented, blank lines written as " .".
          { printf '%s\n' 'Types: deb' \
              'URIs: https://throneproj.github.io/Throne/apt' \
              'Suites: stable' 'Components: main' 'Signed-By:'
            sed 's/^$/./; s/^/ /' ../throne.asc; } > throne.sources
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: repo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
