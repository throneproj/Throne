name: Throne build matrix
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag and version"
        required: true
      publish:
        description: "r for normal release, p for prerelease, leave empty to not publish anything"
        required: false
jobs:
  build-go:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - cross_os: windows
            cross_arch: amd64
            go_version: "1.25.0"
            go_arch_level: v1
          - cross_os: windows
            cross_arch: amd64
            go_version: "1.25.0"
            go_arch_level: v3
          - cross_os: linux
            cross_arch: amd64
            go_version: "1.25.0"
            go_arch_level: v1
          - cross_os: linux
            cross_arch: arm64
            go_version: "1.25.0"
            go_arch_level: v1
          - cross_os: darwin
            cross_arch: amd64
            go_version: "1.25.0"
            go_arch_level: v1
          - cross_os: darwin
            cross_arch: arm64
            go_version: "1.25.0"
            go_arch_level: v1
          - cross_os: windowslegacy
            cross_arch: amd64
            go_version: "1.25.0"
            go_arch_level: v1
          - cross_os: windowslegacy
            cross_arch: 386
            go_version: "1.25.0"
            go_arch_level: v1
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checking out sources
        uses: actions/checkout@v5.0.0
      - name: Cache Common Download
        id: cache-common
        uses: actions/cache@v4.2.4
        with:
          path: artifacts.tgz
          key: CommonCache-${{ matrix.cross_os }}-${{ matrix.cross_arch }}-${{ matrix.go_arch_level }}-${{ hashFiles('script/build_go.sh', 'core/*') }}-${{ matrix.go_version }}
      - name: Install Golang
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ matrix.go_version }}
          cache-dependency-path: |
            core/server/go.sum
            core/updater/go.sum
      - name: Install Golang For Legacy Windows
        if: matrix.cross_os == 'windowslegacy'
        run: |
          curl -L -o go.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/go.7z
          7z x go.7z
      - name: Install Protoc
        run: |
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip"
          unzip "protoc-31.1-linux-x86_64.zip" -d protoc_install
          cp ./protoc_install/bin/protoc /usr/local/bin
          protoc --version
      - name: Installing protoc-gen-go
        run: |
          go install github.com/golang/protobuf/protoc-gen-go@latest
          go install github.com/chai2010/protorpc/protoc-gen-protorpc@latest
      - name: Build golang parts
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        env:
          GOAMD64: ${{ matrix.go_arch_level }}
        run: |
          GOOS=${{ matrix.cross_os }} GOARCH=${{ matrix.cross_arch }} ./script/build_go.sh
      - name: Tar files
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: tar czvf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Throne-${{ github.sha }}-Common-${{ matrix.cross_os }}-${{ matrix.cross_arch }}${{ matrix.go_arch_level != 'v1' && format('-{0}', matrix.go_arch_level) || '' }}
          path: artifacts.tgz

  build-cpp:
    permissions:
      contents: read
    needs:
      - build-go
    strategy:
      matrix:
        include:
          - platform: windows-latest
            qt_version: "6.9.0"
            target: x86_64
          - platform: windows-latest
            qt_version: "6.9.0"
            target: x86_64-v3
          - platform: ubuntu-22.04
            qt_version: "6.9.0"
            target: amd64
          - platform: ubuntu-24.04-arm
            qt_version: "6.9.0"
            target: arm64
          - platform: macos-latest
            qt_version: "6.9.0"
            target: x86_64
          - platform: macos-latest
            qt_version: "6.9.0"
            target: arm64
          - platform: windows-latest
            qt_version: "6.2.12"
            target: x86_64
          - platform: windows-latest
            qt_version: "6.2.12"
            target: i686
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      INPUT_VERSION: ${{ github.event.inputs.tag }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v5.0.0
        with:
          submodules: "recursive"

      - name: Install mingw
        if: matrix.platform == 'windows-latest'
        uses: bwoodsend/setup-winlibs-action@v1.15
        with:
          architecture: ${{ (matrix.target == 'x86_64-v3' || matrix.target == 'x86_64') && 'x86_64' || matrix.target }}

      - name: Download Artifacts
        uses: actions/download-artifact@v5.0.0
        with:
          path: download-artifact

      - name: Qt static Cache
        id: cache-static-Qt
        if: matrix.platform == 'windows-latest' && matrix.qt_version != '6.2.12'
        uses: actions/cache@v4.2.4
        with:
          path: qt6/build
          key: QtStaticCache-${{ matrix.platform }}-${{ matrix.target }}-Qt${{ matrix.qt_version }}

      - name: Install Qt Windows
        shell: powershell
        if: matrix.platform == 'windows-latest' && steps.cache-static-Qt.outputs.cache-hit != 'true' && matrix.qt_version != '6.2.12'
        env:
          CXXFLAGS: ${{ matrix.target == 'x86_64-v3' && '-march=x86-64-v3' || '' }}
        run: ./script/build_qt_static_windows.bat ${{ matrix.qt_version }}

      - name: Verify Static Qt Build
        if: matrix.platform == 'windows-latest' && matrix.qt_version != '6.2.12' && steps.cache-static-Qt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ ! -f "qt6/build/lib/libQt6Core.a" ]; then
            echo "::error::Static Qt library (libQt6Core.a) not found after build. The Qt static build process likely failed."
            exit 1
          fi
          echo "Static Qt libraries found successfully."

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.0
        if: matrix.platform != 'windows-latest'
        with:
          version: ${{ matrix.qt_version }}
          setup-python: true
          cache: true
          cache-key-prefix: QtCache-${{ matrix.platform }}-${{ matrix.target }}

      - name: Windows (x86_64) - Generate MakeFile and Build
        if: matrix.platform == 'windows-latest' && matrix.qt_version == '6.9.0' && matrix.target == 'x86_64'
        shell: bash
        run: |
          export CMAKE_PREFIX_PATH=$PWD/qt6/build/lib/cmake
          mkdir build
          cd build
          cmake -GNinja -DCMAKE_CXX_FLAGS="-static" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=TRUE ..
          ninja -j2
          cd ..
          ./script/deploy_windows.sh

      - name: Windows (x86_64-v3) - Generate MakeFile and Build
        if: matrix.platform == 'windows-latest' && matrix.qt_version == '6.9.0' && matrix.target == 'x86_64-v3'
        shell: bash
        run: |
          export CMAKE_PREFIX_PATH=$PWD/qt6/build/lib/cmake
          mkdir build
          cd build
          cmake -GNinja -DCMAKE_CXX_FLAGS="-static -march=x86-64-v3" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=TRUE ..
          ninja -j2
          cd ..
          ./script/deploy_windows.sh ${{ matrix.target }}

      - name: Legacy Windows - Generate MakeFile and Build
        if: matrix.platform == 'windows-latest' && matrix.qt_version == '6.2.12'
        shell: bash
        run: |
          curl -L -o qt.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/qt-${{ matrix.target }}.7z
          7z x qt.7z
          curl -L -o openssl.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/openssl-${{ matrix.target }}.7z
          7z x openssl.7z
          export CMAKE_PREFIX_PATH=$PWD/Qt/lib/cmake
          export OPENSSL_ROOT_DIR=$PWD/openssl
          mkdir build
          cd build
          cmake -GNinja -DCMAKE_CXX_FLAGS="-static" -DCMAKE_BUILD_TYPE=Debug ..
          ninja -j2
          cd ..
          ./script/deploy_windows.sh ${{ matrix.target }}

      - name: Linux - Generate MakeFile and Build
        if: contains( matrix.platform, 'ubuntu' )
        shell: bash
        run: |
          sudo apt update && sudo apt upgrade -y
          mkdir build
          cd build
          cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=TRUE ..
          ninja
          cd ..
          ./script/deploy_linux64.sh ${{ matrix.target }}

      - name: macOS - Generate MakeFile and Build
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          mkdir build
          cd build
          cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DNKR_PACKAGE_MACOS=1 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_OSX_ARCHITECTURES=${{ matrix.target }} -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=TRUE ..
          ninja
          cd ..
          ./script/deploy_macos.sh ${{ matrix.target }}

      - name: Tar files
        shell: bash
        run: tar czvf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Throne-${{ github.sha }}-${{ matrix.platform }}-${{ matrix.target }}-Qt${{ matrix.qt_version }}
          path: artifacts.tgz

  publish:
    name: Pack & Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-cpp
    permissions:
      contents: write
      actions: read
    env:
      INPUT_VERSION: ${{ github.event.inputs.tag }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v5.0.0
      - name: Download Artifacts
        uses: actions/download-artifact@v5.0.0
        with:
          path: download-artifact
      - name: Pack
        run: |
          curl -Lo - https://github.com/tcnksm/ghr/releases/download/v0.17.0/ghr_v0.17.0_linux_amd64.tar.gz | tar xzv
          mv ghr*linux_amd64/ghr .
          source script/env_deploy.sh
          find . -name artifacts.tgz | xargs -n1 tar xvzf
          cd deployment
          rm -rf *.pdb win*/*.pdb
          ####
          bash ../script/pack_debian.sh ${{ github.event.inputs.tag }}
          mv Throne.deb $version_standalone-debian-x64.deb
          rm -rf Throne
          ####
          mv linux-amd64 Throne
          zip -9 -r $version_standalone-linux-amd64.zip Throne
          rm -rf Throne
          ####
          mv linux-arm64 Throne
          zip -9 -r $version_standalone-linux-arm64.zip Throne
          rm -rf Throne
          ####
          mv windows64 Throne
          zip -9 -r $version_standalone-windows64.zip Throne
          rm -rf Throne
          ####
          mv windows64-v3 Throne
          zip -9 -r $version_standalone-windows64-v3.zip Throne
          rm -rf Throne
          ####
          mv windows32 Throne
          zip -9 -r $version_standalone-windows32.zip Throne
          rm -rf Throne
          ####
          mv windowslegacy64 Throne
          zip -9 -r $version_standalone-windowslegacy64.zip Throne
          rm -rf Throne
          ####
          mkdir Throne
          mv macos-arm64/Throne.app Throne/Throne.app
          zip -9 --symlinks -r $version_standalone-macos-arm64.zip Throne
          rm -rf macos-arm64
          rm -rf Throne
          ####
          mkdir Throne
          mv macos-amd64/Throne.app Throne/Throne.app
          zip -9 --symlinks -r $version_standalone-macos-amd64.zip Throne
          rm -rf macos-amd64
          rm -rf Throne
      - name: Clean Up
        run: |
          cd deployment
          rm -rf windows-arm64
          rm -rf linux-arm64
          rm -rf linux-amd64
          rm -rf windows64
          rm -rf windows64-v3
          rm -rf windows32
          rm -rf windowslegacy64
          rm -rf macos-amd64
          rm -rf macos-arm64
          rm -rf *.pdb
      - name: Uploading Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Deployment-${{ github.sha }}
          path: deployment
      - name: PreRelease
        if: github.event.inputs.publish == 'p'
        run: |
          ./ghr -prerelease -delete -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" "${{ github.event.inputs.tag }}" deployment
      - name: Release
        if: github.event.inputs.publish == 'r'
        run: |
          ./ghr -delete -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" "${{ github.event.inputs.tag }}" deployment
