# Optional drop-in: run throne.service as the "throne" user with five ambient capabilities instead of root.
# Tun and extra-core profiles work; the kill switch reports "unsupported", because it needs root.
# ThroneCore must carry no setuid bit or file capabilities: exec of such a file clears the ambient set.
# Install:
#   sudo useradd --system --no-create-home --home-dir /var/lib/throne --shell /usr/sbin/nologin throne
#   sudo install -Dm644 caps.conf /etc/systemd/system/throne.service.d/caps.conf
#   sudo systemctl daemon-reload && sudo systemctl restart throne
# systemd hands the existing /var/lib/throne over to the new user on the next start.
[Service]
User=throne
Group=throne
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE CAP_SYS_PTRACE CAP_DAC_READ_SEARCH
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE CAP_SYS_PTRACE CAP_DAC_READ_SEARCH
