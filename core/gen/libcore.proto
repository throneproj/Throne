syntax = "proto2";

package libcore;
option go_package = "./;gen";

service LibcoreService {
  rpc Start(LoadConfigReq) returns (ErrorResp);
  rpc Stop(EmptyReq) returns (ErrorResp);
  rpc CheckConfig(LoadConfigReq) returns (ErrorResp);
  rpc Test(TestReq) returns (TestResp);
  rpc StopTest(EmptyReq) returns (EmptyResp);
  rpc QueryURLTest(EmptyReq) returns (QueryURLTestResponse);
  rpc QueryStats(EmptyReq) returns (QueryStatsResp);
  rpc QueryConnections(EmptyReq) returns (QueryConnectionsResp);
  rpc CloseConnections(CloseConnectionsRequest) returns (CloseConnectionsResponse);
  rpc ListProcesses(EmptyReq) returns (ListProcessesResponse);
  //
  rpc IsPrivileged(EmptyReq) returns (IsPrivilegedResponse);
  //
  rpc GetDefaultInterface(EmptyReq) returns (GetDefaultInterfaceResponse);
  //
  rpc SpeedTest(SpeedTestRequest) returns(SpeedTestResponse);
  rpc QuerySpeedTest(EmptyReq) returns(QuerySpeedTestResponse);
  rpc QueryCountryTest(EmptyReq) returns(QueryCountryTestResponse);
  rpc IPTest(IPTestRequest) returns (IPTestResp);
  rpc QueryIPTest(EmptyReq) returns (QueryIPTestResponse);
  //
  rpc GenWgKeyPair(EmptyReq) returns (GenWgKeyPairResponse);
  rpc WarpRegister(WarpRegisterRequest) returns (WarpRegisterResponse);
  rpc GenQuicSignature(GenQuicSignatureRequest) returns (GenQuicSignatureResponse);

  rpc InstallDashboard(InstallDashboardRequest) returns (ErrorResp);
  rpc InstallTor(InstallTorRequest) returns (ErrorResp);
  //
  rpc QueryAutoSelectors(EmptyReq) returns (QueryAutoSelectorsResponse);
  rpc AutoSelectorAction(AutoSelectorActionRequest) returns (ErrorResp);
  //
  rpc QueryVPNStatus(VPNStatusRequest) returns (VPNStatusResponse);
  rpc SubmitVPNChallenge(SubmitVPNChallengeRequest) returns (ErrorResp);
  rpc CancelVPNChallenge(SubmitVPNChallengeRequest) returns (ErrorResp);
  //
  rpc CaptureDiagnostics(DiagnosticsRequest) returns (DiagnosticsResponse);
  rpc StopDiagnostics(EmptyReq) returns (EmptyResp);

  rpc UpdateRuleSets(EmptyReq) returns (UpdateRuleSetsResponse);
  //
  rpc ScanProbe(ScanProbeRequest) returns (ScanProbeResponse);
  rpc QueryScan(QueryScanRequest) returns (QueryScanResponse);
  rpc StopScan(StopScanRequest) returns (EmptyResp);
  rpc ScanURLTest(ScanURLTestRequest) returns (TestResp);
  rpc ScanCheckNetwork(ScanCheckNetworkRequest) returns (ScanCheckNetworkResponse);
  rpc ParseRuleSet(ParseRuleSetRequest) returns (ParseRuleSetResponse);
  rpc ResolveDomains(ResolveDomainsRequest) returns (ResolveDomainsResponse);
  rpc TestRoute(TestRouteRequest) returns (TestRouteResponse);
  rpc ServiceTest(ServiceTestRequest) returns (ServiceTestResponse);
  rpc QueryServiceTest(EmptyReq) returns (QueryServiceTestResponse);
  rpc ParseServiceChecks(ParseServiceChecksRequest) returns (ParseServiceChecksResponse);
}

message EmptyReq {}

message EmptyResp {}

message ErrorResp {
  optional string error = 1 [default = ""];
}

message LoadConfigReq {
  optional string core_config = 1 [default = ""];
  optional bool disable_stats = 2 [default = false];
  optional bool need_extra_process = 3 [default = false];
  optional string extra_process_path = 4 [default = ""];
  optional string extra_process_args = 5 [default = ""];
  optional string extra_process_conf = 6 [default = ""];
  optional bool extra_no_out = 8 [default = false];
  optional bool need_xray = 9 [default = false];
  optional string xray_config = 10 [default = ""];
  optional string tun_ipv4_cidr = 11 [default = ""];
  reserved 12;
  reserved "xray_outbound_dns_address";
  // Xray-style strategy (e.g. "UseIP") for resolution through the box's dns-direct transport; empty => unwired.
  optional string xray_outbound_dns_strategy = 13 [default = ""];
  // Keep the Xray instance cold until something dials it. Set for auto-selector
  // profiles, whose pools can hold Xray members that only get probed once a
  // bench cycle: the core takes over the loopback ports sing-box was told to
  // dial and builds the instance on the first connection instead.
  optional bool xray_lazy_start = 14 [default = false];
  // Seconds without gated traffic before a lazily started instance is shut down
  // again. 0 keeps it resident once it has started.
  optional int32 xray_idle_seconds = 15 [default = 0];
  // Opaque full configs, each its own gated instance backing a socks outbound
  // already in `core_config`. Never merged into `xray_config`.
  repeated string xray_full_configs = 16;
  // Separate from xray_idle_seconds; 0 keeps them resident once started.
  optional int32 xray_full_idle_seconds = 17 [default = 0];
}

message URLTestResp {
  optional string outbound_tag = 1 [default = ""];
  optional int32 latency_ms = 2 [default = 0 ];
  optional string error = 3 [default = ""];
}

message TestReq {
  optional string config = 1 [default = ""];
  repeated string outbound_tags = 2;
  optional bool use_default_outbound = 3 [default = false];
  optional string url = 4 [default = ""];
  optional bool test_current = 5 [default = false];
  optional int32 max_concurrency = 6 [default = 0];
  optional int32 test_timeout_ms = 7 [default = 0];
  optional bool need_xray = 8 [default = false];
  optional string xray_config = 9 [default = ""];
  // Opaque full configs, each its own instance backing a socks outbound already
  // in `config`. Never merged into `xray_config`.
  repeated string xray_full_configs = 10;
  // Inspected inside the same test box: it dies with the RPC, so no later query can.
  repeated string vpn_endpoint_tags = 11;
  reserved 12;
  reserved "vpn_status_timeout_ms";
  reserved 13;
  reserved "xray_outbound_dns_address";
  // See LoadConfigReq; empty leaves the Xray on the OS resolver, which a running TUN owns.
  optional string xray_outbound_dns_strategy = 14 [default = ""];
}

message TestResp {
  repeated URLTestResp results = 1;
  // Only for vpn_endpoint_tags whose URL probe genuinely failed.
  repeated VPNEndpointStatus vpn_status = 2;
}

message VPNChallengeChoice {
  optional string value = 1 [default = ""];
  optional string label = 2 [default = ""];
}

message VPNChallengeField {
  optional string submission_key = 1 [default = ""];
  optional string name = 2 [default = ""];
  optional string label = 3 [default = ""];
  // text | password | select
  optional string kind = 4 [default = ""];
  optional string value = 5 [default = ""];
  repeated VPNChallengeChoice options = 6;
}

// The endpoint is parked waiting for a human; nothing moves until Submit/Cancel.
message VPNChallenge {
  optional string endpoint_tag = 1 [default = ""];
  optional string id = 2 [default = ""];
  // openvpn: credentials|secret|message|open-url   openconnect: form|browser
  optional string kind = 3 [default = ""];
  optional string username = 4 [default = ""];
  optional string message = 5 [default = ""];
  optional string banner = 6 [default = ""];
  optional string error = 7 [default = ""];
  optional string url = 8 [default = ""];
  // false => the answer is a secret and must be masked.
  optional bool echo = 9 [default = false];
  optional int64 deadline = 10 [default = 0];
  repeated VPNChallengeField fields = 11;
}

// One openvpn/openconnect endpoint's tunnel state.
message VPNEndpointStatus {
  optional string tag = 1 [default = ""];
  // connecting | auth-pending | connected | error
  optional string state = 2 [default = ""];
  optional string error = 3 [default = ""];
  optional bool connected = 4 [default = false];
  // Present only while connected.
  repeated string ipv4 = 5;
  repeated string ipv6 = 6;
  repeated string dns = 7;
  optional int32 mtu = 8 [default = 0];
  optional int64 connected_since = 9 [default = 0];
  optional string server = 10 [default = ""];
  // openvpn: tunnel network; openconnect: transport.
  optional string network = 11 [default = ""];
  // Server-advertised routes, i.e. what a `preferred_by` route rule matches.
  repeated string routes = 12;
  repeated string excluded_routes = 13;
  // Every suffix `preferred_by` matches: search domains plus pushed split-DNS suffixes.
  repeated string search_domains = 14;
  // openvpn only; openconnect reports its transport in `network` instead.
  optional string cipher = 15 [default = ""];
  optional VPNChallenge challenge = 16;
  // `error` is a rejected login; neither core prompts for config-supplied credentials.
  optional bool auth_failed = 17 [default = false];
}

message VPNStatusRequest {
  repeated string endpoint_tags = 1;
  // Wait this long for a tag still handshaking; 0 answers with the current state.
  optional int32 timeout_ms = 2 [default = 0];
}

message VPNStatusResponse {
  repeated VPNEndpointStatus results = 1;
}

// Answers the challenge `challenge_id` on `endpoint_tag`: openvpn reads
// username/password/secret, openconnect reads form_values keyed by submission_key.
message SubmitVPNChallengeRequest {
  optional string endpoint_tag = 1 [default = ""];
  optional string challenge_id = 2 [default = ""];
  optional string username = 3 [default = ""];
  optional string password = 4 [default = ""];
  optional string secret = 5 [default = ""];
  map<string, string> form_values = 6;
}

message QueryStatsResp{
  map<string, int64> ups = 1;
  map<string, int64> downs = 2;
}

// active = currently live connections (drives the connection table).
// closed = the core's recently-closed ring (non-draining); consumers dedup by
// id. Together they let the client diff per-connection byte counters without
// losing the tail of a connection that closed between polls.
message QueryConnectionsResp {
  repeated ConnectionMetaData active = 1;
  repeated ConnectionMetaData closed = 2;
}

message ConnectionMetaData {
  optional string id = 1 [default = ""];
  optional int64 created_at = 2 [default = 0];
  optional int64 upload = 3 [default = 0];
  optional int64 download = 4 [default = 0];
  optional string outbound = 5 [default = ""];
  optional string network = 6 [default = ""];
  optional string dest = 7 [default = ""];
  optional string protocol = 8 [default = ""];
  optional string domain = 9 [default = ""];
  optional string process = 10 [default = ""];      // basename, e.g. chrome.exe
  optional string process_path = 11 [default = ""]; // full path (icon lookup etc.)
  repeated string chain = 12;                        // outbound chain, for later use
  optional int64 closed_at = 13 [default = 0];       // 0 while live
  optional string source = 14 [default = ""];        // client address "ip:port", empty when unknown
  optional string rule = 15 [default = ""];          // matched route rule as sing-box prints it, empty when routed by final
  optional string rule_item = 16 [default = ""];     // the rule's entries that matched, e.g. "domain_suffix=github.com"; empty when unknown
}

// Ids come from a previous QueryConnections; ones that already closed are a
// no-op, so a stale table never turns into an error.
message CloseConnectionsRequest {
  repeated string ids = 1;
}

message CloseConnectionsResponse {
  optional int32 closed = 1 [default = 0];
  optional string error = 2 [default = ""];
}

// A running program, spelled exactly as the router's process matcher sees it.
message ProcessEntry {
  optional uint32 pid = 1 [default = 0];
  // What process_name compares against: the base name of path, or the OS's name for it when path is unreadable.
  optional string name = 2 [default = ""];
  // What process_path compares against; empty when the core could not read it.
  optional string path = 3 [default = ""];
  // Windows: the display name of a service hosted in a shared process (svchost). name and path are then the
  // service's DLL, which the matcher compares too.
  optional string service = 4 [default = ""];
}

message ListProcessesResponse {
  repeated ProcessEntry processes = 1;
  optional string error = 2 [default = ""];
}

message IsPrivilegedResponse {
  optional bool has_privilege = 1 [default = false];
  // Linux: /dev/net/tun opened read-write. Unset elsewhere.
  optional bool tun_device = 2;
  // Linux: CAP_NET_ADMIN in the effective set. Unset elsewhere.
  optional bool net_admin = 3;
  // Linux: euid 0 and CAP_NET_ADMIN; macOS: euid 0. Unset on Windows.
  optional bool kill_switch_privilege = 4;
  // The first failing reason, plain English; empty when nothing failed.
  optional string detail = 5;
  // The pid of the process answering; on Windows an elevated core runs apart from the stub Throne started.
  optional int32 core_pid = 6;
}

message GetDefaultInterfaceResponse {
  optional string name = 1 [default = ""];
  optional int32 index = 2 [default = 0];
}

message SpeedTestRequest {
  optional string config = 1 [default = ""];
  repeated string outbound_tags = 2;
  optional bool test_current = 3 [default = false];
  optional bool use_default_outbound = 4 [default = false];
  optional bool test_download = 5 [default = false];
  optional bool test_upload = 6 [default = false];
  optional bool simple_download = 7 [default = false];
  optional string simple_download_addr = 8 [default = ""];
  optional int32 timeout_ms = 9 [default = 0];
  optional bool only_country = 10 [default = false];
  optional int32 country_concurrency = 11 [default = 0];
  optional bool need_xray = 12 [default = false];
  optional string xray_config = 13 [default = ""];
  // See TestReq.xray_full_configs.
  repeated string xray_full_configs = 14;
  reserved 15;
  reserved "xray_outbound_dns_address";
  // See TestReq.xray_outbound_dns_strategy.
  optional string xray_outbound_dns_strategy = 16 [default = ""];
}

message SpeedTestResult {
  optional string dl_speed = 1 [default = ""];
  optional string ul_speed = 2 [default = ""];
  optional int32 latency = 3 [default = 0];
  optional string outbound_tag = 4 [default = ""];
  optional string error = 5 [default = ""];
  optional string server_name = 6 [default = ""];
  optional string server_country = 7 [default = ""];
  optional bool cancelled = 8 [default = false];
  optional int64 dl_bytes = 9 [default = 0];  // bytes moved by the test, for traffic stats
  optional int64 ul_bytes = 10 [default = 0];
}

message SpeedTestResponse {
  repeated SpeedTestResult results = 1;
}

message QuerySpeedTestResponse {
  optional SpeedTestResult result = 1;
  optional bool is_running = 2 [default = false];
}

message QueryCountryTestResponse {
  repeated SpeedTestResult results = 1;
}

message QueryURLTestResponse {
  repeated URLTestResp results = 1;
}

message IPTestRes {
  optional string outbound_tag = 1 [default = ""];
  optional string ip = 2 [default = "" ];
  optional string country_code = 3 [default = ""];
  optional string error = 4 [default = ""];
}

message IPTestRequest {
  optional string config = 1 [default = ""];
  repeated string outbound_tags = 2;
  optional bool use_default_outbound = 3 [default = false];
  optional int32 max_concurrency = 4 [default = 0];
  optional int32 test_timeout_ms = 5 [default = 0];
  optional bool need_xray = 6 [default = false];
  optional string xray_config = 7 [default = ""];
  // See TestReq.xray_full_configs.
  repeated string xray_full_configs = 8;
  reserved 9;
  reserved "xray_outbound_dns_address";
  // See TestReq.xray_outbound_dns_strategy.
  optional string xray_outbound_dns_strategy = 10 [default = ""];
  // An exit_lookup_provider id (ip2location, ip-api, ipwho, ipinfo, ipapi-co, freeipapi, cloudflare);
  // "" or auto tries ip2location, ip-api, ipwho, ipinfo and cloudflare in turn.
  optional string provider = 11 [default = ""];
}

message IPTestResp {
  repeated IPTestRes results = 1;
}

message QueryIPTestResponse {
  repeated IPTestRes results = 1;
}

message GenWgKeyPairResponse {
  optional string private_key = 1 [default = ""];
  optional string public_key = 2 [default = ""];
  optional string error = 3 [default = ""];
}

message WarpRegisterRequest {
  optional string tunnel_type = 1 [default = ""]; // "wireguard" | "masque"
  optional string proxy = 2 [default = ""];       // "http://[user:pass@]host:port"; empty = direct
  repeated string api_hosts = 3;                  // tried in order; empty = api.cloudflareclient.com
  // Direct calls only: through a proxy the ClientHello is the proxy outbound's to shape.
  optional bool tls_fragment = 4 [default = false];
  optional bool tls_record_fragment = 5 [default = false];
  optional string tls_fragment_fallback_delay = 6 [default = ""]; // Go duration; empty = 500ms
}

message WarpRegisterResponse {
  optional string error = 1 [default = ""];
  optional string device_id = 2 [default = ""];
  optional string token = 3 [default = ""];
  optional string license = 4 [default = ""];
  optional string ipv4 = 5 [default = ""];            // bare address
  optional string ipv6 = 6 [default = ""];            // bare address
  optional string private_key = 7 [default = ""];     // wireguard: base64 x25519; masque: base64 SEC1 DER P-256
  optional string peer_public_key = 8 [default = ""]; // wireguard: base64 x25519; masque: base64 SPKI DER (PEM armor stripped)
  optional string endpoint = 9 [default = ""];        // host:port (IPv6 bracketed)
  repeated int32 reserved = 10;                       // wireguard client_id bytes
}

message GenQuicSignatureRequest {
  optional string domain = 1 [default = ""];
}

message GenQuicSignatureResponse {
  optional string error = 1 [default = ""];
  repeated string packets = 2; // AmneziaWG I1.. in order, each "<b 0x…>"
}

// One member of a running auto-selector group. Everything the UI needs to
// explain why a server was picked, skipped or demoted is carried here — the
// selector must never look like a silent black box.
message AutoSelectorMember {
  optional string tag = 1 [default = ""];
  optional int32 rank = 2 [default = 0];
  // ok | degraded | suspect | untested | dead | cooldown
  optional string state = 3 [default = ""];
  optional bool selected = 4 [default = false];
  optional bool selected_udp = 5 [default = false];
  optional bool qualified = 6 [default = false];
  // true while the member sits in the fast-probe tier
  optional bool active = 7 [default = false];
  optional int32 average_ms = 8 [default = 0];
  optional int32 deviation_ms = 9 [default = 0];
  optional int32 min_ms = 10 [default = 0];
  optional int32 max_ms = 11 [default = 0];
  optional int32 samples = 12 [default = 0];
  optional int32 failures = 13 [default = 0];
  optional int32 probes = 14 [default = 0];
  optional int32 dial_total = 15 [default = 0];
  optional int32 dial_fail = 16 [default = 0];
  optional int64 last_ok_ms = 17 [default = 0];
  optional int64 last_probe_ms = 18 [default = 0];
  optional int64 cooldown_until_ms = 19 [default = 0];
  optional string last_error = 20 [default = ""];
  // priority strategy: index of the member's tier, 0 = most preferred
  optional int32 priority = 21 [default = 0];
  // successful checks in a row since the last failure; fail-back needs failback_checks of them
  optional int32 streak = 22 [default = 0];
  // last failed check or dial, 0 = none on record
  optional int64 last_failure_ms = 23 [default = 0];
  // passive scoring: time-weighted average time to the first response byte on real connections, 0 = none yet
  optional int32 first_byte_ms = 24 [default = 0];
  optional int32 passive_answered = 25 [default = 0];
  optional int32 passive_failed = 26 [default = 0];
  // the same outcomes with exponential decay, rounded; suspect needs recent_failed >= 3 and >= recent_answered
  optional int32 recent_answered = 27 [default = 0];
  optional int32 recent_failed = 28 [default = 0];
  // passive scoring holds the member out of the selection until then, 0 = not suspect
  optional int64 suspect_until_ms = 29 [default = 0];
}

message AutoSelectorStatus {
  optional string tag = 1 [default = ""];
  // starting | probing | ready | suspended
  optional string phase = 2 [default = ""];
  optional string selected = 3 [default = ""];
  optional string selected_udp = 4 [default = ""];
  // The member a user pinned by hand, empty when fully automatic. Differs from
  // `selected` whenever the pinned member is not currently healthy.
  optional string pinned = 21 [default = ""];
  optional bool balance = 5 [default = false];
  optional string balance_mode = 6 [default = ""];
  // suspended => the core believes the LOCAL network is down and has frozen the
  // ranking. Consumers must not treat members as broken while this is set.
  optional bool suspended = 7 [default = false];
  optional int64 suspended_since_ms = 8 [default = 0];
  optional int32 members_total = 9 [default = 0];
  optional int32 members_probed = 10 [default = 0];
  optional int32 members_alive = 11 [default = 0];
  optional int32 members_qualified = 12 [default = 0];
  optional int32 members_cooldown = 13 [default = 0];
  optional int32 probes_in_flight = 14 [default = 0];
  optional int32 rounds_completed = 15 [default = 0];
  optional int64 last_round_ms = 16 [default = 0];
  optional int64 next_round_ms = 17 [default = 0];
  optional int64 last_switch_ms = 18 [default = 0];
  optional string last_switch_reason = 19 [default = ""];
  repeated AutoSelectorMember members = 20;
  // latency | priority
  optional string strategy = 22 [default = ""];
  // priority strategy: what a recovered higher-tier member must pass before the group moves back up to it
  optional int32 failback_checks = 23 [default = 0];
  optional int64 failback_delay_ms = 24 [default = 0];
  // passive scoring is on; sites_remembered counts sites holding a member that answered them
  optional bool passive = 25 [default = false];
  optional int32 sites_remembered = 26 [default = 0];
}

// Idempotent snapshot: unlike QueryStats this never clears core-side counters,
// so it is safe to poll from more than one consumer.
message QueryAutoSelectorsResponse {
  repeated AutoSelectorStatus groups = 1;
}

message AutoSelectorActionRequest {
  optional string tag = 1 [default = ""];
  // recheck = force a full sweep now; select = pin the group to `member`
  optional string action = 2 [default = ""];
  optional string member = 3 [default = ""];
}

// Throne downloads the archive (proxy settings apply there); the core has the zip reader.
message InstallDashboardRequest {
  optional string archive_path = 1 [default = ""];
  optional string target_dir = 2 [default = ""];
}

message InstallTorRequest {
  optional string archive_path = 1 [default = ""];
  optional string sha256 = 2 [default = ""];
}

message DiagnosticsAttachment {
  optional string name = 1 [default = ""];
  optional bytes data = 2;
}

message DiagnosticsRequest {
  optional int32 duration_ms = 1 [default = 0];
  optional bool contention = 2 [default = false];
  optional bool trace = 3 [default = false];
  // Zipped under app/; the core never reads a GUI-supplied path.
  repeated DiagnosticsAttachment attachments = 4;
}

message DiagnosticsResponse {
  optional string error = 1 [default = ""];
  optional bytes archive = 2;
}

message UpdateRuleSetsResponse {
  optional int32 updated = 1 [default = 0];
  optional string error = 2 [default = ""];
}

message ScanEntry {
  // A prefix or a bare address.
  optional string cidr = 1 [default = ""];
  // 0 = each of ScanTargetSpec.default_ports.
  optional int32 port = 2 [default = 0];
}

message ScanTargetSpec {
  repeated ScanEntry entries = 1;
  // Empty leaves portless entries at port 0: each phase applies its own fallback.
  repeated int32 default_ports = 2;
  // 0 = every address; entries wider than 2^32 addresses are always sampled.
  optional int64 max_hosts_per_entry = 3 [default = 0];
  optional bool shuffle = 4 [default = true];
  optional uint64 seed = 5 [default = 0];
  // "" = the entry's port, else default_ports | ignore = default_ports only | merge = both | list = the entry's port only
  optional string port_mode = 6 [default = ""];
}

message ScanIcmpOptions {
  optional bool enabled = 1 [default = false];
  optional int32 timeout_ms = 2 [default = 1000];
  optional int32 count = 3 [default = 1];
}

message ScanTcpOptions {
  optional bool enabled = 1 [default = false];
  optional int32 timeout_ms = 2 [default = 2000];
  optional int32 attempts = 3 [default = 1];
  optional int32 fallback_port = 4 [default = 443];
}

message ScanHttpOptions {
  optional bool enabled = 1 [default = false];
  optional bool tls = 2 [default = true];
  optional string server_name = 3 [default = ""];
  optional string host = 4 [default = ""];
  optional string path = 5 [default = "/"];
  // GET | HEAD | NONE (TLS handshake only)
  optional string method = 6 [default = "GET"];
  // 1.1 | 2 | 3
  optional string http_version = 7 [default = "1.1"];
  repeated string alpn = 8;
  optional string min_version = 9 [default = ""];
  optional string max_version = 10 [default = ""];
  // Empty = Go TLS; otherwise a uTLS fingerprint.
  optional string fingerprint = 11 [default = ""];
  optional bool insecure = 12 [default = false];
  optional bool disable_sni = 13 [default = false];
  optional bool fragment = 14 [default = false];
  optional int32 fragment_fallback_delay_ms = 15 [default = 0];
  optional bool record_fragment = 16 [default = false];
  optional bool mixed_case_sni = 17 [default = false];
  reserved 18, 19, 20;
  reserved "expected_status", "body_contains", "user_agent";
  optional int32 timeout_ms = 21 [default = 3000];
  optional int32 fallback_port = 22 [default = 443];
}

// When enabled, a target is probed as a resolver only: no icmp, tcp or http phase runs. Port 0 = 53.
message ScanDnsOptions {
  optional bool enabled = 1 [default = false];
  // dnstt | masterdns | xdns
  optional string protocol = 2 [default = ""];
  // dnstt/masterdns: the base profile's sing-box outbound object; xdns: the base's xdns mask settings. Resolvers are replaced per target.
  optional string config_json = 3 [default = ""];
  // dnstt: poll | qname | handshake; masterdns: quick | full; xdns: poll | qname
  optional string level = 4 [default = ""];
  // Bounds one target's whole probe.
  optional int32 timeout_ms = 5 [default = 5000];
}

message ScanProbeRequest {
  optional string session_id = 1 [default = ""];
  optional ScanTargetSpec spec = 2;
  // Position in the spec's order; resume from next_cursor.
  optional uint64 cursor = 3 [default = 0];
  // 0 = count only: nothing is probed, total is still reported.
  optional int32 max_targets = 4 [default = 0];
  optional ScanIcmpOptions icmp = 5;
  optional ScanTcpOptions tcp = 6;
  optional ScanHttpOptions http = 7;
  optional int32 concurrency = 8 [default = 0];
  optional int32 spawn_interval_ms = 9 [default = 0];
  optional ScanDnsOptions dns = 10;
}

message ScanProbeResult {
  optional string address = 1 [default = ""];
  optional int32 port = 2 [default = 0];
  optional bool passed = 3 [default = false];
  // icmp | tcp | tls | http | dns; empty when passed
  optional string failed_phase = 4 [default = ""];
  optional string error = 5 [default = ""];
  optional int32 icmp_ms = 6 [default = 0];
  optional int32 tcp_ms = 7 [default = 0];
  optional int32 tls_ms = 8 [default = 0];
  optional int32 http_ms = 9 [default = 0];
  optional int32 http_status = 10 [default = 0];
  // The port TCP/TLS/DNS actually used: the phase fallback when port is 0.
  optional int32 probe_port = 11 [default = 0];
  // The failure came from this machine (no route or address for the family), not the target.
  optional bool local_failure = 12 [default = false];
  // dnstt/xdns: RTT of the first exchange the resolver answered, failed targets included; masterdns: mean RTT at the found MTUs, passes only. 0 = none.
  optional int32 dns_ms = 13 [default = 0];
  // dnstt: max_qname_len units; xdns: lenLimit units (wire length).
  optional int32 max_qname = 14 [default = 0];
  optional int32 upload_mtu = 15 [default = 0];
  optional int32 download_mtu = 16 [default = 0];
  // The stage a failed target stopped at.
  optional string dns_stage = 17 [default = ""];
}

message ScanProbeResponse {
  optional string error = 1 [default = ""];
  optional uint64 total = 2 [default = 0];
  // Every position below it finished; on abort it stops at the first unfinished one.
  optional uint64 next_cursor = 3 [default = 0];
  optional bool aborted = 4 [default = false];
  // Finished targets only, in completion order.
  repeated ScanProbeResult results = 5;
  optional int32 sampled_entries = 6 [default = 0];
  optional int32 invalid_entries = 7 [default = 0];
}

message ScanEvent {
  optional int64 seq = 1 [default = 0];
  // start | ok | fail
  optional string kind = 2 [default = ""];
  // icmp | tcp | tls | http | dns | url
  optional string phase = 3 [default = ""];
  // Display form; IPv6 is bracketed.
  optional string target = 4 [default = ""];
  optional int32 latency_ms = 5 [default = 0];
  optional string error = 6 [default = ""];
}

message QueryScanRequest {
  optional string session_id = 1 [default = ""];
  optional int64 after_seq = 2 [default = 0];
}

// Counters are cumulative over the session.
message QueryScanResponse {
  // Newest last; only the most recent ones are kept.
  repeated ScanEvent events = 1;
  optional int64 last_seq = 2 [default = 0];
  optional int64 probed = 3 [default = 0];
  optional int64 probe_passed = 4 [default = 0];
  optional int64 url_tested = 5 [default = 0];
  optional int64 url_passed = 6 [default = 0];
}

// A stopped session refuses every later probe or URL test that names it.
message StopScanRequest {
  optional string session_id = 1 [default = ""];
}

message ScanURLTestRequest {
  optional string session_id = 1 [default = ""];
  optional TestReq test = 2;
  // Aligned with test.outbound_tags; used as the event target.
  repeated string target_labels = 3;
  // false = one request per target, so the latency includes the handshake.
  optional bool warm_latency = 4 [default = true];
  // > 0: one cold GET per target that passes only with a 2xx and this many body bytes; warm_latency is ignored.
  optional int64 body_bytes = 5 [default = 0];
}

message ScanCheckNetworkRequest {
  // host:port, TCP.
  repeated string targets = 1;
  optional int32 timeout_ms = 2 [default = 3000];
}

message ScanCheckNetworkResponse {
  optional bool up = 1 [default = false];
  optional string error = 2 [default = ""];
}

// Binary (.srs) or JSON source, sniffed from the magic.
message ParseRuleSetRequest {
  optional bytes content = 1;
}

message ParseRuleSetResponse {
  optional string error = 1 [default = ""];
  repeated string cidrs = 2;
  // Inverted and AND rules: they do not describe a set of addresses.
  optional int32 skipped_rules = 3 [default = 0];
  optional int32 version = 4 [default = 0];
}

// Looked up through dns-direct, the resolver the core dials servers with, never the OS resolver.
message ResolveDomainsRequest {
  repeated string domains = 1;
  // A probe box config, started only when the running profile has no dns-direct (or none runs).
  optional string config = 2 [default = ""];
}

message ResolveDomainsResponse {
  // In request order.
  repeated ResolvedDomain results = 1;
}

message ResolvedDomain {
  optional string domain = 1 [default = ""];
  repeated string addresses = 2;
  optional string error = 3 [default = ""];
}

// Walks route.rules for one made-up connection the way the router would, dialing nothing.
message TestRouteRequest {
  // A process name ("chrome.exe") or a full executable path. A Windows service DLL is tested with the svchost.exe hosting it, as the searcher reports it.
  optional string process = 1 [default = ""];
  // With both domain and ip the connection goes to ip and domain is what a sniff rule finds, as under Tun.
  optional string domain = 2 [default = ""];
  optional string ip = 3 [default = ""];
  optional int32 port = 4 [default = 443];
  // "tcp" or "udp".
  optional string network = 5 [default = "tcp"];
  // What a sniff rule finds: "auto" guesses from network and port, "none" finds nothing, else a sniffer name (tls, http, quic, dns...).
  optional string protocol = 6 [default = "auto"];
  // Empty tests the running instance. Otherwise a full config that is started stripped for this test only:
  // no inbounds, no DNS section, every outbound and endpoint a stub, and rules that need a live endpoint (preferred_by) skipped.
  optional string config = 7 [default = ""];
}

message TestRouteStep {
  // Index into the config's route.rules.
  optional int32 index = 1 [default = -1];
  // The rule's conditions as sing-box describes them.
  optional string rule = 2 [default = ""];
  // The action type: route, route-options, reject, hijack-dns, bypass, sniff or resolve.
  optional string action = 3 [default = ""];
  // The action as sing-box describes it, e.g. "route(proxy)".
  optional string action_detail = 4 [default = ""];
  // The values that made it match, like ConnectionMetaData.rule_item; empty for a rule without single entries.
  optional string matched = 5 [default = ""];
  // sniff: the protocol and domain it found, both empty when it found nothing.
  optional string protocol = 6 [default = ""];
  optional string sniffed_domain = 7 [default = ""];
  // resolve: the addresses it got.
  repeated string addresses = 8;
  // The step failed: a lookup error, say.
  optional string error = 9 [default = ""];
  // Why a step did nothing, or what else it changed (an override); English, from the core.
  optional string note = 10 [default = ""];
}

message TestRouteResponse {
  optional string error = 1 [default = ""];
  // Every rule that matched, in order.
  repeated TestRouteStep steps = 2;
  // No rule decided, so route.final applies.
  optional bool is_final = 3 [default = false];
  // route, reject, hijack-dns or bypass; "error" when a step failed the connection, which the last step's error explains.
  optional string action = 4 [default = ""];
  // The outbound tag for route, bypass and the final.
  optional string outbound = 5 [default = ""];
  // Each group the outbound leads through, followed by its current pick: [pick, pick of pick, ...].
  repeated string outbound_chain = 6;
  // Indexes of rules left out of a stripped config, which therefore never matched.
  repeated int32 skipped = 7;
  // The destination after sniffing, resolving and overrides.
  optional string destination = 8 [default = ""];
  optional string domain = 9 [default = ""];
  repeated string addresses = 10;
  // The inbound tag the connection was taken to arrive on.
  optional string inbound = 11 [default = ""];
}

message ServiceTestRequest {
  optional string config = 1 [default = ""];
  repeated string outbound_tags = 2;
  optional bool use_default_outbound = 3 [default = false];
  optional int32 max_concurrency = 4 [default = 0];
  // Per request; 0 = 10 s.
  optional int32 test_timeout_ms = 5 [default = 0];
  optional bool need_xray = 6 [default = false];
  optional string xray_config = 7 [default = ""];
  // See TestReq.xray_full_configs.
  repeated string xray_full_configs = 8;
  // See TestReq.xray_outbound_dns_strategy.
  optional string xray_outbound_dns_strategy = 9 [default = ""];
  // The check definitions document (checks.json).
  optional string checks = 10 [default = ""];
  // Ids of the checks to run; empty runs them all.
  repeated string only = 11;
  optional bool skip_ip_info = 12 [default = false];
  // Checks the running instance's proxy outbound instead of building a box from `config`.
  optional bool test_current = 13 [default = false];
}

message ServiceCheckOutcome {
  optional string id = 1 [default = ""];
  optional string name = 2 [default = ""];
  optional string category = 3 [default = ""];
  // available | partial | restricted | blocked | unknown | failed
  optional string status = 4 [default = ""];
  // ISO 3166-1 alpha-2 country the service placed the exit in, "" = not known.
  optional string region = 5 [default = ""];
  // Short English detail: the matched rule's note, or the error.
  optional string note = 6 [default = ""];
}

message ServiceIPInfo {
  optional string provider = 1 [default = ""];
  optional string ip = 2 [default = ""];
  optional string country_code = 3 [default = ""];
  optional string asn = 4 [default = ""];
  optional string org = 5 [default = ""];
  // The provider's network type, lower case: isp, hosting, business, education...
  optional string type = 6 [default = ""];
  // 0-100, -1 = the provider gives none.
  optional int32 risk_score = 7 [default = -1];
  // The flags the provider set, among vpn, proxy, tor, hosting, abuser, anonymous, relay, mobile.
  repeated string flags = 8;
  optional string error = 9 [default = ""];
}

message ServiceTestResult {
  optional string outbound_tag = 1 [default = ""];
  repeated ServiceCheckOutcome checks = 2;
  repeated ServiceIPInfo ip_info = 3;
  // The profile could not be checked at all (tunnel down, aborted); checks is then empty.
  optional string error = 4 [default = ""];
}

message ServiceTestResponse {
  repeated ServiceTestResult results = 1;
}

message QueryServiceTestResponse {
  repeated ServiceTestResult results = 1;
}

message ParseServiceChecksRequest {
  optional string checks = 1 [default = ""];
}

message ServiceCategory {
  optional string id = 1 [default = ""];
  optional string name = 2 [default = ""];
  optional string icon = 3 [default = ""];
}

message ServiceCheckInfo {
  optional string id = 1 [default = ""];
  optional string name = 2 [default = ""];
  optional string category = 3 [default = ""];
}

message ParseServiceChecksResponse {
  // Why the document was rejected; the other fields are then empty.
  optional string error = 1 [default = ""];
  optional int32 version = 2 [default = 0];
  optional int64 revision = 3 [default = 0];
  repeated ServiceCategory categories = 4;
  repeated ServiceCheckInfo checks = 5;
}
