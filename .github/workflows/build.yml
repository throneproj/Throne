name: Throne build matrix
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag and version"
        required: true
      publish:
        description: "r for normal release, p for prerelease, leave empty to not publish anything"
        required: false
jobs:
  build-go:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - cross_os: windows
            cross_arch: amd64
            go_version: "1.27.0"
            runner: ubuntu-22.04
          - cross_os: windows
            cross_arch: arm64
            go_version: "1.27.0"
            runner: ubuntu-22.04
          - cross_os: linux
            cross_arch: amd64
            go_version: "1.27.0"
            runner: ubuntu-22.04
          - cross_os: linux
            cross_arch: arm64
            go_version: "1.27.0"
            runner: ubuntu-22.04
          - cross_os: darwin
            cross_arch: amd64
            go_version: "1.27.0"
            runner: macos-latest
          - cross_os: darwin
            cross_arch: arm64
            go_version: "1.27.0"
            runner: macos-latest
          - cross_os: darwinlegacy
            cross_arch: amd64
            go_version: "1.27.0"
            runner: macos-latest
          - cross_os: windowslegacy
            cross_arch: amd64
            go_version: "1.27.0"
            runner: macos-latest
          - cross_os: windowslegacy
            cross_arch: 386
            go_version: "1.27.0"
            runner: macos-latest
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    env:
      DEST: ${{ github.workspace }}/deployment/${{ matrix.cross_os }}-${{ matrix.cross_arch }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Cache Common Download
        id: cache-common
        uses: actions/cache@v6.1.0
        with:
          path: artifacts.tgz
          key: CommonCache-${{ matrix.cross_os }}-${{ matrix.cross_arch }}-${{ hashFiles('script/build_go.sh', 'core/**') }}-${{ matrix.go_version }}
      - name: Install Golang
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go_version }}
          cache-dependency-path: |
            core/go.sum
      - name: Install Golang For Legacy OS
        if: steps.cache-common.outputs.cache-hit != 'true' && contains( matrix.cross_os, 'legacy' )
        run: |
          curl -L -o go.zip https://github.com/throneproj/env_windows_legacy/releases/download/latest/go.zip
          7z x go.zip
      - name: Install Protoc
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Installing protoc-gen-go
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Clone cronet-go
        if: matrix.cross_os == 'linux'
        run: |
          set -xeuo pipefail
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/throneproj/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "2ee86b72426042457b8eb879ab32296f5752bf2f"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1
      - name: Download Chromium toolchain
        if: matrix.cross_os == 'linux'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.cross_arch }} download-toolchain
      - name: Set Chromium toolchain environment
        if: matrix.cross_os == 'linux'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.cross_arch }} env >> $GITHUB_ENV
      - name: Build golang parts
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        run: |
          GOOS=${{ matrix.cross_os }} GOARCH=${{ matrix.cross_arch }} ./script/build_go.sh
      - name: Tar files
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: tar czf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Throne-${{ github.sha }}-Common-${{ matrix.cross_os }}-${{ matrix.cross_arch }}
          path: artifacts.tgz
          compression-level: 0
  build-android:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    env:
      DEST: ${{ github.workspace }}/deployment/android
      NDK_VERSION: "28.2.13676358"
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Install Golang
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            core/go.sum
      - name: Install JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK
        run: |
          set -xeuo pipefail
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
      - name: Build Android AAR
        shell: bash
        run: ./script/build_android.sh
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ThroneCore-android-${{ github.sha }}
          path: deployment/android/ThroneCore.aar
          if-no-files-found: error
          compression-level: 0
  build-cpp:
    permissions:
      contents: read
    needs:
      - build-go
    strategy:
      matrix:
        include:
          - platform: windows-latest
            qt_version: "6.11.2"
            target: x64
            dest_suffix: windows-amd64
            common: windows-amd64
            launcher: sccache
          - platform: windows-11-arm
            qt_version: "6.11.2"
            target: arm64
            dest_suffix: windows-arm64
            common: windows-arm64
            launcher: ""
          - platform: ubuntu-22.04
            qt_version: "6.11.2"
            target: x86_64
            dest_suffix: linux-amd64
            common: linux-amd64
            launcher: ccache
          - platform: ubuntu-22.04
            qt_version: "6.2.0"
            target: x86_64
            dest_suffix: linux-amd64-system-qt
            common: linux-amd64
            launcher: ccache
          - platform: ubuntu-24.04-arm
            qt_version: "6.11.1"
            target: aarch64
            dest_suffix: linux-arm64
            common: linux-arm64
            launcher: ccache
          - platform: ubuntu-22.04-arm
            qt_version: "6.2.0"
            target: aarch64
            dest_suffix: linux-arm64-system-qt
            common: linux-arm64
            launcher: ccache
          - platform: macos-latest
            qt_version: "6.11.2"
            target: x86_64
            dest_suffix: darwin-amd64
            common: darwin-amd64
            launcher: ccache
          - platform: macos-latest
            qt_version: "6.11.2"
            target: arm64
            dest_suffix: darwin-arm64
            common: darwin-arm64
            launcher: ccache
          - platform: macos-15
            qt_version: "6.4.3"
            target: x86_64
            dest_suffix: darwinlegacy-amd64
            common: darwinlegacy-amd64
            launcher: ccache
          - platform: windows-latest
            qt_version: "6.2.13"
            target: x64
            dest_suffix: windowslegacy-amd64
            common: windowslegacy-amd64
            launcher: sccache
          - platform: windows-2022
            qt_version: "6.2.13"
            target: x86
            dest_suffix: windowslegacy-386
            common: windowslegacy-386
            launcher: sccache
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    env:
      INPUT_VERSION: ${{ github.event.inputs.tag }}
      DEST: ${{ github.workspace }}/deployment/${{ matrix.dest_suffix }}
      DEST_SUFFIX: ${{ matrix.dest_suffix }}
      ARCH: ${{ matrix.target }}
      LAUNCHER_ARGS: ${{ matrix.launcher != '' && format('-DCMAKE_C_COMPILER_LAUNCHER={0} -DCMAKE_CXX_COMPILER_LAUNCHER={0}', matrix.launcher) || '' }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Checking out the web dashboard
        uses: actions/checkout@v7.0.1
        with:
          repository: SagerNet/sing-box-dashboard
          ref: gh-pages
          path: dashboard-src
      - name: Bundling the web dashboard
        shell: bash
        run: |
          # Read-only pack files make this flaky on Windows; cmake filters .git out anyway.
          rm -rf dashboard-src/.git || true
          cp -R dashboard-src/. res/dashboard/
          # cmake globs res/dashboard at configure time and silently ships nothing if it
          # is empty, so fail here instead of releasing a build without the dashboard.
          test -f res/dashboard/index.html
      - name: Install MSVC compiler
        if: contains( matrix.platform, 'windows' )
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target }}
      - name: Setup compiler cache
        if: matrix.launcher != ''
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.dest_suffix }}-${{ matrix.qt_version }}
          variant: ${{ matrix.launcher }}
          max-size: 500M
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: Throne-${{ github.sha }}-Common-${{ matrix.common }}
          path: download-artifact
      # ========================================================================================================= Qt Install
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        if: (!contains(matrix.platform, 'windows')) && matrix.qt_version != '6.2.0'
        with:
          version: ${{ matrix.qt_version }}
          setup-python: true
          cache: true
          cache-key-prefix: QtCache-${{ matrix.dest_suffix }}
      # ========================================================================================================= Generate MakeFile and Build
      - name: Windows - Cache Qt and OpenSSL
        id: cache-winqt
        if: contains( matrix.platform, 'windows' )
        uses: actions/cache@v6.1.0
        with:
          path: |
            qt.7z
            openssl.7z
          key: WinQt-${{ matrix.qt_version }}-${{ matrix.target }}
      - name: Windows - Download Qt and OpenSSL
        shell: bash
        if: contains( matrix.platform, 'windows' ) && steps.cache-winqt.outputs.cache-hit != 'true'
        run: |
          curl -L -o qt.7z https://github.com/throneproj/buildqt/releases/download/Qt_${{ matrix.qt_version }}/Qt_${{ matrix.qt_version }}_${{ matrix.target }}.7z
          curl -L -o openssl.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/openssl_${{ matrix.target }}.7z
      - name: Windows - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'windows' )
        run: |
          7z x qt.7z
          7z x openssl.7z
          export CMAKE_PREFIX_PATH=$PWD/Qt/lib/cmake
          export OPENSSL_ROOT_DIR=$PWD/openssl
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_windows.sh
      - name: Linux - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'ubuntu' ) && matrix.qt_version != '6.2.0'
        run: |
          sudo apt update
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_linux64.sh
      - name: Linux Using System Qt - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'ubuntu' ) && matrix.qt_version == '6.2.0'
        run: |
          sudo apt update
          sudo apt install -y qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6svg6-dev qt6-translations-l10n libglx-dev libgl1-mesa-dev
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc" $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_linux64_system_qt.sh
      - name: macOS - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'macos' )
        run: |
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNKR_PACKAGE_MACOS=1 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_OSX_ARCHITECTURES=${{ matrix.target }} $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_macos.sh
      # ========================================================================================================= Deployments
      - name: Tar files
        shell: bash
        run: tar czf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Throne-${{ github.sha }}-${{ matrix.dest_suffix }}
          path: artifacts.tgz
          compression-level: 0
  pack:
    name: Pack ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs:
      - build-cpp
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: windows
            runner: windows-latest
            artifacts: "windows*"
          - target: linux-amd64
            runner: ubuntu-latest
            artifacts: "linux-amd64*"
            tools: rpm
          - target: linux-arm64
            runner: ubuntu-latest
            artifacts: "linux-arm64*"
            tools: rpm
          - target: macos
            runner: ubuntu-latest
            artifacts: "darwin*"
          - target: debug
            runner: ubuntu-latest
            artifacts: "*"
      fail-fast: false
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Throne-${{ github.sha }}-${{ matrix.artifacts }}
          path: download-artifact
      - name: Install packaging tools
        if: matrix.tools
        run: sudo apt install ${{ matrix.tools }}
      - name: Pack
        shell: bash
        run: bash ./script/pack_release.sh ${{ matrix.target }} "${{ github.event.inputs.tag }}"
      - name: Uploading Artifact
        if: matrix.target != 'debug'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Pack-${{ github.sha }}-${{ matrix.target }}
          path: deployment/Throne-*
          if-no-files-found: error
          compression-level: 0
      - name: Uploading Debug Artifact
        if: matrix.target == 'debug'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Debug-${{ github.sha }}
          path: deployment/debug-symbols.zip
          if-no-files-found: error
          compression-level: 0
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - pack
      - build-android
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Pack-${{ github.sha }}-*
          merge-multiple: true
          path: deployment
      - name: Download Android AAR
        uses: actions/download-artifact@v8.0.1
        with:
          name: ThroneCore-android-${{ github.sha }}
          path: deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Deployment-${{ github.sha }}
          path: deployment
          compression-level: 0
      - name: Installing ghr
        run: |
          curl -Lo - https://github.com/tcnksm/ghr/releases/download/v0.17.0/ghr_v0.17.0_linux_amd64.tar.gz | tar xzv
          mv ghr*linux_amd64/ghr .
      - name: PreRelease
        if: github.event.inputs.publish == 'p'
        run: |
          ./ghr -prerelease -delete -c ${{ github.sha }} -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" "${{ github.event.inputs.tag }}" deployment
      - name: Release
        if: github.event.inputs.publish == 'r'
        run: |
          ./ghr -delete -c ${{ github.sha }} -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" "${{ github.event.inputs.tag }}" deployment
